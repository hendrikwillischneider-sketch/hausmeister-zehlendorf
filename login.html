.top{text-align:center;margin-bottom:24px}
.top-icon{font-size:48px;display:block;margin-bottom:8px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.3))}
.top-title{color:#fff;font-size:18px;font-weight:700}
.top-sub{color:rgba(255,255,255,.5);font-size:12px;margin-top:3px}
.card{background:var(--card);border-radius:20px;padding:28px 24px;width:100%;max-width:360px;
  box-shadow:0 8px 40px rgba(0,0,0,.25)}
.slbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--muted);margin-bottom:10px}
.role-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:22px}
.role-btn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:14px 8px;
  background:var(--bg);border:2px solid var(--border);border-radius:14px;
  font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;
  transition:all .15s;text-align:center;line-height:1.2}
.role-btn:hover,.role-btn:focus{border-color:var(--accent);color:var(--text);outline:none}
.role-btn.active{border-color:var(--accent);background:rgba(82,183,136,.12);color:var(--green-mid)}
.role-icon{font-size:24px;display:block}
.divider{display:flex;align-items:center;gap:10px;margin:0 0 18px;color:var(--muted);font-size:11px}
.divider::before,.divider::after{content:'';flex:1;border-top:1px solid var(--border)}
.err{background:var(--red-pale);color:var(--red);border-radius:10px;padding:10px 14px;
  font-size:13px;margin-bottom:14px;display:none;line-height:1.4}
.err.show{display:block}
.f-group{margin-bottom:14px}
.f-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin-bottom:6px;display:block}
.f-in{width:100%;padding:13px 15px;border:2px solid var(--border);border-radius:11px;
  font-size:16px;background:var(--bg);color:var(--text);font-family:inherit;
  -webkit-appearance:none;transition:border-color .15s}
.f-in:focus{outline:none;border-color:var(--accent)}
.btn{width:100%;padding:15px;border:none;border-radius:11px;background:var(--green-mid);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
  transition:background .15s,opacity .15s;margin-top:4px}
.btn:hover{background:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.footer{margin-top:20px;text-align:center;color:rgba(255,255,255,.3);font-size:11px}
.footer a{color:rgba(255,255,255,.5);text-decoration:none}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
  vertical-align:middle;margin-right:6px}
</style>
</head>
<body>
<div class="top">
  <span class="top-icon">🏡</span>
  <div class="top-title">Sidonie-Scharfe-Stiftung</div>
  <div class="top-sub">Wohnheim Zehlendorf · Interner Zugang</div>
</div>
<div class="card">
  <div class="slbl">Schnellauswahl</div>
  <div class="role-grid">
    <button class="role-btn" onclick="prefill('hendrik')" id="chip-hendrik">
      <span class="role-icon">👷</span>Hendrik
    </button>
    <button class="role-btn" onclick="prefill('schwade')" id="chip-schwade">
      <span class="role-icon">👩‍💼</span>Frau Schwade
    </button>
    <button class="role-btn" onclick="prefill('hv')" id="chip-hv">
      <span class="role-icon">🏢</span>Hausverwaltung
    </button>
  </div>
  <div class="divider">oder E-Mail eingeben</div>
  <div class="err" id="err"></div>
  <div class="f-group">
    <label class="f-lbl" for="email">E-Mail</label>
    <input class="f-in" id="email" type="email" placeholder="name@example.de"
      autocomplete="email" autocapitalize="none" spellcheck="false"
      onkeydown="if(event.key==='Enter')document.getElementById('pw').focus()">
  </div>
  <div class="f-group">
    <label class="f-lbl" for="pw">Passwort</label>
    <input class="f-in" id="pw" type="password" placeholder="••••••••"
      autocomplete="current-password"
      onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <button class="btn" id="btn" onclick="doLogin()">Anmelden</button>
</div>
<div class="footer">
  Sidonie-Scharfe-Stiftung · Zehlendorf &nbsp;·&nbsp;
  <a href="portal.html">Bewohner-Portal</a>
</div>
<script>
const SB='https://rzpsmvczwaeraupnhhkx.supabase.co';
const KEY='sb_publishable_5EQDj7OHubzmp-xlTH98LQ_qld7wPem';
const ROUTES={
  'hendrikwillischneider@gmail.com':{key:'hm_auth',target:'intern.html'},
  'hendrikwillischneider+schwade@gmail.com':{key:'sw_auth',target:'schwade.html'},
  'hendrikwillischneider+reporting@gmail.com':{key:'rep_auth',target:'reporting.html'},
};
const PREFILL={hendrik:'hendrikwillischneider@gmail.com',schwade:'hendrikwillischneider+schwade@gmail.com',hv:'hendrikwillischneider+reporting@gmail.com'};
function prefill(role){
  document.getElementById('email').value=PREFILL[role]||'';
  document.querySelectorAll('.role-btn').forEach(c=>c.classList.remove('active'));
  document.getElementById('chip-'+role)?.classList.add('active');
  document.getElementById('pw').focus();
}
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('pw').value;
  const btn=document.getElementById('btn');
  const err=document.getElementById('err');
  err.classList.remove('show');
  if(!email||!pw){err.textContent='Bitte E-Mail und Passwort eingeben.';err.classList.add('show');return;}
  const route=ROUTES[email];
  if(!route){err.textContent='Kein Zugang für diese E-Mail-Adresse.';err.classList.add('show');return;}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>Anmeldung …';
  try{
    const res=await fetch(`${SB}/auth/v1/token?grant_type=password`,{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const d=await res.json();
    if(!d.access_token){err.textContent='E-Mail oder Passwort falsch.';err.classList.add('show');
      document.getElementById('pw').value='';btn.disabled=false;btn.textContent='Anmelden';return;}
    sessionStorage.setItem(route.key,d.access_token);
    sessionStorage.setItem(route.key+'_exp',Date.now()+d.expires_in*1000);
    window.location.href=route.target;
  }catch{err.textContent='Verbindungsfehler. Bitte erneut versuchen.';err.classList.add('show');
    btn.disabled=false;btn.textContent='Anmelden';}
}
setTimeout(()=>document.getElementById('email').focus(),100);
</script>
</body>
