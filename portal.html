<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1C4A2E">
<title>Bewohner-Portal — Sidonie-Scharfe-Stiftung</title>
<style>
:root{
  --green:#1C4A2E;--green-mid:#2d6a4f;--accent:#52b788;--green-pale:#d8f3dc;
  --red:#c1121f;--red-pale:#ffe5e5;
  --bg:#F6F1E9;--card:#FDFAF4;--border:#D4CBB8;--text:#1A1510;--text-muted:#7A7168;
  --orange:#e07b39;--orange-pale:#fdebd5;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0E1810;--card:#142012;--border:#2A3828;--text:#E4DDD0;--text-muted:#8A8278;
  --green-pale:#1a3c2e;--red-pale:#3a0f0f;--orange-pale:#3a2010;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:480px;margin:0 auto}

/* Header */
.hdr{background:var(--green);color:#fff;padding:18px 18px 0;text-align:center}
.hdr-logo{font-size:30px;margin-bottom:6px}
.hdr-title{font-size:18px;font-weight:700}
.hdr-sub{font-size:12px;opacity:.6;margin-top:2px;padding-bottom:0}

/* Tab navigation */
.tab-bar{background:var(--green);display:flex;padding:12px 18px 0;gap:4px}
.tab-btn{flex:1;padding:10px 8px 12px;border:none;background:rgba(255,255,255,.12);color:rgba(255,255,255,.7);border-radius:10px 10px 0 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}
.tab-btn.active{background:var(--bg);color:var(--green);border-radius:10px 10px 0 0}
.tab-btn:not(.active):hover{background:rgba(255,255,255,.2)}

/* Progress (for wizard) */
.progress{display:flex;gap:6px;padding:14px 18px 0;background:var(--bg);border-bottom:2px solid var(--border)}
.prog-dot{flex:1;height:4px;border-radius:2px;background:var(--border);transition:background .3s}
.prog-dot.done{background:var(--accent)}
.prog-dot.active{background:var(--green-mid)}

.content{padding:22px 18px 110px}

.step-num{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}
.step-title{font-size:23px;font-weight:700;margin-bottom:6px;line-height:1.2}
.step-sub{font-size:14px;color:var(--text-muted);margin-bottom:24px;line-height:1.5}

.field{margin-bottom:18px}
.field-lbl{font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:7px}
.field-in{width:100%;padding:15px 14px;border:2px solid var(--border);border-radius:12px;font-size:17px;background:var(--card);color:var(--text);font-family:inherit;transition:border-color .15s;-webkit-appearance:none}
.field-in:focus{outline:none;border-color:var(--accent)}
textarea.field-in{resize:none;height:110px;line-height:1.5;font-size:16px}

.raum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.raum-btn{padding:15px 10px;border:2px solid var(--border);border-radius:13px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;text-align:center;transition:all .15s;font-family:inherit;line-height:1.3}
.raum-btn:active{transform:scale(.97)}
.raum-btn.sel{border-color:var(--accent);background:var(--green-pale);color:var(--green-mid);font-weight:600}
.raum-icon{font-size:24px;display:block;margin-bottom:5px}

.foto-prompt{border:2px dashed var(--border);border-radius:13px;padding:26px 16px;text-align:center;cursor:pointer;transition:border-color .15s;margin-bottom:10px;background:var(--card)}
.foto-prompt:active{border-color:var(--accent)}
.foto-prompt-icon{font-size:38px;margin-bottom:8px}
.foto-prompt-lbl{font-size:14px;font-weight:600;margin-bottom:4px}
.foto-prompt-sub{font-size:12px;color:var(--text-muted)}
.foto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.foto-thumb{aspect-ratio:1;border-radius:10px;object-fit:cover;width:100%}
.foto-thumb-wrap{position:relative}
.foto-rm{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:14px 18px 32px;background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px}
.btn-back{flex:0 0 auto;padding:15px 20px;border:2px solid var(--border);border-radius:12px;background:none;font-size:15px;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit}
.btn-next{flex:1;padding:15px;border:none;border-radius:12px;background:var(--green-mid);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s}
.btn-next:active{opacity:.85}
.btn-next:disabled{opacity:.4;cursor:default}

.success{text-align:center;padding:52px 24px}
.success-icon{font-size:68px;margin-bottom:18px}
.success-title{font-size:25px;font-weight:700;margin-bottom:10px;color:var(--green-mid)}
.success-text{font-size:15px;color:var(--text-muted);line-height:1.6;margin-bottom:28px}
.success-box{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:16px;font-size:13px;color:var(--text-muted);margin-bottom:24px;text-align:left}
.success-box strong{color:var(--text);font-size:15px;display:block;margin-bottom:4px}
.btn-new{padding:15px 28px;background:var(--green-mid);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}

.err-box{background:var(--red-pale);color:var(--red);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:none}
.err-box.show{display:block}

.dsgvo{font-size:11px;color:var(--text-muted);line-height:1.5;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* Meine Meldungen */
.mm-gate{padding:32px 0}
.mm-gate-icon{font-size:52px;text-align:center;margin-bottom:16px}
.mm-gate-title{font-size:22px;font-weight:700;text-align:center;margin-bottom:8px}
.mm-gate-sub{font-size:14px;color:var(--text-muted);text-align:center;line-height:1.5;margin-bottom:28px}
.mm-row{display:flex;gap:10px}
.mm-row .field{flex:1;margin-bottom:0}

.meldung-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.meldung-card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.meldung-card-title{font-weight:700;font-size:15px}
.status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap}
.status-Offen{background:var(--orange-pale);color:var(--orange)}
.status-In-Bearbeitung{background:#dbeafe;color:#1d4ed8}
.status-Erledigt{background:var(--green-pale);color:var(--green-mid)}
.meldung-card-meta{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.meldung-card-text{font-size:14px;color:var(--text-muted);line-height:1.4}

.empty-state{text-align:center;padding:48px 16px;color:var(--text-muted)}
.empty-icon{font-size:48px;margin-bottom:12px}

.mm-logout{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.mm-user-label{font-size:13px;color:var(--text-muted)}
.mm-user-name{font-weight:700;color:var(--text)}
.btn-logout{padding:7px 14px;border:1.5px solid var(--border);border-radius:8px;background:none;font-size:12px;color:var(--text-muted);cursor:pointer;font-family:inherit}

/* Hausverwaltung Login (diskreter Bereich) */
.hv-link{display:block;text-align:center;padding:18px;font-size:12px;color:var(--text-muted);cursor:pointer;border-top:1px solid var(--border);margin-top:10px}
.hv-link:hover{color:var(--green-mid)}

.hv-gate{padding:32px 0}
.hv-gate-icon{font-size:48px;text-align:center;margin-bottom:14px}
.hv-gate-title{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.hv-gate-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-bottom:24px}
.btn-full{width:100%;padding:15px;border:none;border-radius:12px;background:var(--green-mid);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:8px}
.btn-full:disabled{opacity:.4}

/* Reporting */
.report-section{margin-bottom:28px}
.report-section-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:12px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat-card{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:14px 10px;text-align:center}
.stat-num{font-size:28px;font-weight:700;line-height:1}
.stat-lbl{font-size:11px;color:var(--text-muted);margin-top:4px}
.stat-num.offen{color:var(--orange)}
.stat-num.ok{color:var(--green-mid)}
.report-table{width:100%;border-collapse:collapse;font-size:13px}
.report-table th{text-align:left;padding:8px 10px;font-size:11px;font-weight:700;color:var(--text-muted);border-bottom:1.5px solid var(--border)}
.report-table td{padding:10px;border-bottom:1px solid var(--border);vertical-align:top}
.report-table tr:last-child td{border-bottom:none}
.report-table-wrap{background:var(--card);border:1.5px solid var(--border);border-radius:13px;overflow:hidden;overflow-x:auto}
.loading{text-align:center;padding:40px;color:var(--text-muted)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">🏡</div>
  <div class="hdr-title">Bewohner-Portal</div>
  <div class="hdr-sub">Sidonie-Scharfe-Stiftung · Zehlendorf</div>
</div>
<div class="tab-bar">
  <button class="tab-btn active" id="tab-melden" onclick="showTab('melden')">Schaden melden</button>
  <button class="tab-btn" id="tab-meine" onclick="showTab('meine')">Meine Meldungen</button>
</div>

<div class="progress" id="progress-bar" style="display:none">
  <div class="prog-dot active" id="pd-1"></div>
  <div class="prog-dot" id="pd-2"></div>
  <div class="prog-dot" id="pd-3"></div>
</div>

<div class="content" id="content"></div>

<div class="bottom-nav" id="bottom-nav" style="display:none">
  <button class="btn-back" id="btn-back" onclick="stepBack()">← Zurück</button>
  <button class="btn-next" id="btn-next" onclick="stepNext()">Weiter →</button>
</div>
<input type="file" id="foto-in" accept="image/*" capture="environment" multiple style="display:none" onchange="addFotos(this)">

<script>
const SB  = 'https://rzpsmvczwaeraupnhhkx.supabase.co';
const KEY = 'sb_publishable_5EQDj7OHubzmp-xlTH98LQ_qld7wPem';

// shared bewohner account
const BW_EMAIL = 'hendrikwillischneider+bewohner@gmail.com';
const BW_PW    = 'Bewoh' + 'ner26';

let currentTab = 'melden';
let step = 1;
const STEPS = 3;
let state = { name: '', zimmer: '', raum: '', problem: '', fotos: [] };

// Session tokens
let bwToken = null, bwExp = 0;
let hvToken = null, hvExp = 0;
let hvSession = null; // { name, email }

const RAEUME = [
  {v:'Küche',           icon:'🍳'},
  {v:'Bad / Dusche',    icon:'🚿'},
  {v:'WC / Toilette',   icon:'🚽'},
  {v:'Wohnzimmer',      icon:'🛋️'},
  {v:'Schlafzimmer',    icon:'🛏️'},
  {v:'Flur / Eingang',  icon:'🚪'},
  {v:'Balkon',          icon:'🌿'},
  {v:'Treppenhaus',     icon:'🏛'},
  {v:'Keller',          icon:'🔑'},
  {v:'Sonstiges',       icon:'📍'},
];

// ── Tab Navigation ────────────────────────────────────────────────────────────
function showTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab-' + tab)?.classList.add('active');

  const pb = document.getElementById('progress-bar');
  const bn = document.getElementById('bottom-nav');

  if (tab === 'melden') {
    pb.style.display = 'flex';
    bn.style.display = 'flex';
    renderWizard();
  } else {
    pb.style.display = 'none';
    bn.style.display = 'none';
    renderMeineMeldungen();
  }
}

// ── Wizard (Schaden melden) ───────────────────────────────────────────────────
function renderWizard() {
  document.getElementById('progress-bar').style.display = step < 4 ? 'flex' : 'none';
  document.getElementById('bottom-nav').style.display   = step < 4 ? 'flex' : 'none';

  for (let i = 1; i <= STEPS; i++) {
    const el = document.getElementById('pd-' + i);
    if (el) el.className = 'prog-dot' + (i < step ? ' done' : i === step ? ' active' : '');
  }
  document.getElementById('btn-back').style.display = step > 1 ? '' : 'none';
  const nxt = document.getElementById('btn-next');
  nxt.textContent = step === STEPS ? 'Absenden' : 'Weiter →';
  nxt.disabled = false;

  if (step === 1) renderStep1();
  if (step === 2) renderStep2();
  if (step === 3) renderStep3();
}

function renderStep1() {
  document.getElementById('content').innerHTML = `
    <div class="step-num">Schritt 1 von 3</div>
    <div class="step-title">Wie heißt du?</div>
    <div class="step-sub">Dein Name hilft uns bei Rückfragen — optional.</div>
    <div class="err-box" id="s1-err">Bitte einen Namen eingeben.</div>
    <div class="field">
      <div class="field-lbl">Dein Name <span style="font-weight:400">(optional)</span></div>
      <input class="field-in" id="s1-name" type="text" placeholder="z. B. Hildegard Müller"
        value="${state.name}" autocomplete="name" onkeydown="if(event.key==='Enter')stepNext()">
    </div>
    <div class="dsgvo">🔒 Datenschutz: Dein Name wird nur zur Bearbeitung deiner Meldung verwendet und nicht an Dritte weitergegeben. Verantwortlich: Sidonie-Scharfe-Stiftung, Zehlendorf.</div>`;
  setTimeout(() => document.getElementById('s1-name')?.focus(), 100);
}

function renderStep2() {
  document.getElementById('content').innerHTML = `
    <div class="step-num">Schritt 2 von 3</div>
    <div class="step-title">Wo ist das Problem?</div>
    <div class="step-sub">Tippe auf den Bereich, in dem der Schaden ist.</div>
    <div class="err-box" id="s2-err">Bitte einen Bereich auswählen.</div>
    <div class="raum-grid">
      ${RAEUME.map(r => `<button class="raum-btn${state.raum === r.v ? ' sel' : ''}" onclick="selRaum('${r.v}',this)">
        <span class="raum-icon">${r.icon}</span>${r.v}
      </button>`).join('')}
    </div>`;
}

function selRaum(v, el) {
  state.raum = v;
  document.querySelectorAll('.raum-btn').forEach(b => b.classList.remove('sel'));
  el.classList.add('sel');
}

function renderStep3() {
  document.getElementById('content').innerHTML = `
    <div class="step-num">Schritt 3 von 3</div>
    <div class="step-title">Was ist passiert?</div>
    <div class="step-sub">Eine kurze Beschreibung reicht. Ein Foto hilft uns sehr.</div>
    <div class="err-box" id="s3-err">Bitte das Problem kurz beschreiben.</div>
    <div class="field">
      <div class="field-lbl">Beschreibung</div>
      <textarea class="field-in" id="s3-prob" placeholder="z. B. Wasserhahn tropft, Heizung kalt, Türschloss klemmt …">${state.problem}</textarea>
    </div>
    <div class="field">
      <div class="field-lbl">📷 Foto <span style="font-weight:400">(empfohlen)</span></div>
      <div class="foto-prompt" onclick="document.getElementById('foto-in').click()">
        <div class="foto-prompt-icon">${state.fotos.length ? '✅' : '📷'}</div>
        <div class="foto-prompt-lbl">${state.fotos.length ? state.fotos.length + ' Foto' + (state.fotos.length > 1 ? 's' : '') + ' ausgewählt' : 'Foto aufnehmen oder auswählen'}</div>
        <div class="foto-prompt-sub">${state.fotos.length ? 'Tippen zum Hinzufügen' : 'Kamera oder Galerie'}</div>
      </div>
      ${state.fotos.length ? `<div class="foto-grid">${state.fotos.map((f, i) => `
        <div class="foto-thumb-wrap">
          <img class="foto-thumb" src="${f}">
          <button class="foto-rm" onclick="rmFoto(${i})">×</button>
        </div>`).join('')}</div>` : ''}
    </div>`;
  setTimeout(() => document.getElementById('s3-prob')?.focus(), 100);
}

function addFotos(inp) {
  Array.from(inp.files).slice(0, 4 - state.fotos.length).forEach(f => {
    const r = new FileReader();
    r.onload = e => { state.fotos.push(e.target.result); renderStep3(); };
    r.readAsDataURL(f);
  });
  inp.value = '';
}
function rmFoto(i) { state.fotos.splice(i, 1); renderStep3(); }

function stepNext() {
  if (step === 1) {
    state.name = document.getElementById('s1-name')?.value?.trim() || '';
    step = 2; renderWizard(); return;
  }
  if (step === 2) {
    if (!state.raum) { document.getElementById('s2-err').classList.add('show'); return; }
    step = 3; renderWizard(); return;
  }
  if (step === 3) {
    const prob = document.getElementById('s3-prob')?.value?.trim();
    if (!prob) { document.getElementById('s3-err').classList.add('show'); return; }
    state.problem = prob;
    submitSchaden();
  }
}

function stepBack() { if (step > 1) { step--; renderWizard(); } }

async function submitSchaden() {
  const btn = document.getElementById('btn-next');
  btn.disabled = true;
  btn.textContent = 'Wird gesendet …';

  const payload = {
    datum: new Date().toISOString().slice(0, 10),
    ort: state.raum,
    problem: state.problem,
    kategorie: 'Schaden',
    prio: 'Mittel',
    von: state.name ? state.name + ' (Bewohner-Portal)' : 'Bewohnerin (Bewohner-Portal)',
    name: state.name || null,
    status: 'Offen',
    foto: state.fotos.length ? JSON.stringify(state.fotos) : null,
  };

  try {
    const r = await fetch(`${SB}/rest/v1/schaden`, {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, Prefer: 'return=representation', 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!r.ok) throw await r.text();
    step = 4; renderWizardSuccess();
  } catch {
    btn.disabled = false;
    btn.textContent = 'Absenden';
    alert('Fehler beim Senden. Bitte versuche es nochmal.');
  }
}

function renderWizardSuccess() {
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('bottom-nav').style.display = 'none';
  document.getElementById('content').innerHTML = `
    <div class="success">
      <div class="success-icon">✅</div>
      <div class="success-title">Vielen Dank!</div>
      <div class="success-text">
        Deine Meldung wurde an den Hausmeister weitergeleitet.<br>
        Wir kümmern uns so schnell wie möglich darum.
      </div>
      <div class="success-box">
        <strong>${state.raum}</strong>
        ${state.problem.slice(0, 100)}${state.problem.length > 100 ? ' …' : ''}
        ${state.name ? `<span style="display:block;margin-top:6px;font-size:12px;color:var(--text-muted)">Gemeldet von: ${state.name}</span>` : ''}
      </div>
      <button class="btn-new" onclick="resetWizard()">Weiteren Schaden melden</button>
    </div>`;
}

function resetWizard() {
  state = { name: '', zimmer: '', raum: '', problem: '', fotos: [] };
  step = 1;
  document.getElementById('progress-bar').style.display = 'flex';
  document.getElementById('bottom-nav').style.display = 'flex';
  renderWizard();
}

// ── Meine Meldungen ───────────────────────────────────────────────────────────
function renderMeineMeldungen() {
  if (bwToken && Date.now() < bwExp && state.name) {
    loadMeineMeldungen();
    return;
  }
  // Show name + Zimmernummer gate
  document.getElementById('content').innerHTML = `
    <div class="mm-gate">
      <div class="mm-gate-icon">📋</div>
      <div class="mm-gate-title">Meine Meldungen</div>
      <div class="mm-gate-sub">Gib deinen Namen ein, um deine Schadensmeldungen zu sehen.</div>
      <div class="err-box" id="mm-err">Name nicht gefunden oder Fehler beim Laden.</div>
      <div class="field">
        <div class="field-lbl">Dein Name</div>
        <input class="field-in" id="mm-name" type="text" placeholder="z. B. Hildegard Müller" autocomplete="name">
      </div>
      <div class="field">
        <div class="field-lbl">Zimmernummer <span style="font-weight:400">(optional)</span></div>
        <input class="field-in" id="mm-zimmer" type="text" placeholder="z. B. 204"
          onkeydown="if(event.key==='Enter')mmLogin()">
      </div>
      <button class="btn-full" id="mm-btn" onclick="mmLogin()">Meine Meldungen anzeigen</button>
      <div class="dsgvo">🔒 Dein Name wird nur zum Filtern deiner eigenen Meldungen verwendet.</div>
    </div>
    <div id="hv-section"></div>`;
  renderHvLink();
  setTimeout(() => document.getElementById('mm-name')?.focus(), 100);
}

async function mmLogin() {
  const nameVal   = document.getElementById('mm-name')?.value?.trim();
  const zimmerVal = document.getElementById('mm-zimmer')?.value?.trim();
  const btn       = document.getElementById('mm-btn');
  const err       = document.getElementById('mm-err');

  if (!nameVal) { err.textContent = 'Bitte deinen Namen eingeben.'; err.classList.add('show'); return; }
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Wird geladen …';

  // Login with shared bewohner account
  if (!bwToken || Date.now() >= bwExp) {
    try {
      const res = await fetch(`${SB}/auth/v1/token?grant_type=password`, {
        method: 'POST',
        headers: { apikey: KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: BW_EMAIL, password: BW_PW })
      });
      const d = await res.json();
      if (!d.access_token) throw new Error('auth failed');
      bwToken = d.access_token;
      bwExp   = Date.now() + d.expires_in * 1000;
    } catch {
      err.textContent = 'Verbindungsfehler. Bitte später erneut versuchen.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Meine Meldungen anzeigen';
      return;
    }
  }

  state.name   = nameVal;
  state.zimmer = zimmerVal;
  loadMeineMeldungen();
}

async function loadMeineMeldungen() {
  document.getElementById('content').innerHTML = '<div class="loading">Wird geladen …</div>';

  try {
    const params = new URLSearchParams({ 'name': `ilike.*${state.name}*`, order: 'datum.desc', limit: '50' });
    const res = await fetch(`${SB}/rest/v1/schaden?${params}`, {
      headers: { apikey: KEY, Authorization: `Bearer ${bwToken}` }
    });
    if (!res.ok) throw new Error('fetch failed');
    const data = await res.json();

    let html = `
      <div class="mm-logout">
        <div>
          <div class="mm-user-label">Angemeldet als</div>
          <div class="mm-user-name">${state.name}${state.zimmer ? ' · Zimmer ' + state.zimmer : ''}</div>
        </div>
        <button class="btn-logout" onclick="mmLogout()">Abmelden</button>
      </div>`;

    if (data.length === 0) {
      html += `<div class="empty-state">
        <div class="empty-icon">📭</div>
        <div>Keine Meldungen unter diesem Namen gefunden.</div>
        <div style="font-size:12px;margin-top:8px">Hast du deinen Schaden ohne Namen eingereicht?</div>
      </div>`;
    } else {
      html += `<div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">${data.length} Meldung${data.length !== 1 ? 'en' : ''} gefunden</div>`;
      html += data.map(s => {
        const statusClass = 'status-' + (s.status || 'Offen').replace(/\s/g,'-');
        return `<div class="meldung-card">
          <div class="meldung-card-head">
            <div class="meldung-card-title">${s.ort || '—'}</div>
            <div class="status-pill ${statusClass}">${s.status || 'Offen'}</div>
          </div>
          <div class="meldung-card-meta">${s.datum || ''}</div>
          <div class="meldung-card-text">${(s.problem || '').slice(0,120)}${(s.problem||'').length>120?'…':''}</div>
        </div>`;
      }).join('');
    }

    document.getElementById('content').innerHTML = html;
    const hv = document.createElement('div');
    document.getElementById('content').appendChild(hv);
    renderHvLinkInto(hv);
  } catch {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div>Fehler beim Laden der Meldungen.</div>
        <button class="btn-full" style="margin-top:16px" onclick="mmLogout()">Neu anmelden</button>
      </div>`;
  }
}

function mmLogout() {
  bwToken = null; bwExp = 0; state.name = ''; state.zimmer = '';
  renderMeineMeldungen();
}

// ── Hausverwaltung Link & Login ───────────────────────────────────────────────
function renderHvLink() {
  const el = document.getElementById('hv-section');
  if (el) renderHvLinkInto(el);
}

function renderHvLinkInto(el) {
  el.innerHTML = hvSession
    ? ''
    : `<div class="hv-link" onclick="renderHvGate()">🏢 Hausverwaltung</div>`;
}

function renderHvGate() {
  document.getElementById('content').innerHTML = `
    <div class="hv-gate">
      <div class="hv-gate-icon">🏢</div>
      <div class="hv-gate-title">Hausverwaltung</div>
      <div class="hv-gate-sub">Reporting-Zugang für interne Nutzung</div>
      <div class="err-box" id="hv-err">E-Mail oder Passwort ungültig.</div>
      <div class="field">
        <div class="field-lbl">E-Mail</div>
        <input class="field-in" id="hv-email" type="email" placeholder="name@hausverwaltung.de" autocomplete="email">
      </div>
      <div class="field">
        <div class="field-lbl">Passwort</div>
        <input class="field-in" id="hv-pw" type="password" placeholder="••••••••"
          onkeydown="if(event.key==='Enter')hvLogin()">
      </div>
      <button class="btn-full" id="hv-btn" onclick="hvLogin()">Anmelden</button>
      <div style="text-align:center;margin-top:14px">
        <span style="font-size:12px;color:var(--text-muted);cursor:pointer" onclick="showTab('melden')">← Zurück</span>
      </div>
    </div>`;
  setTimeout(() => document.getElementById('hv-email')?.focus(), 100);
}

async function hvLogin() {
  const email = document.getElementById('hv-email')?.value?.trim();
  const pw    = document.getElementById('hv-pw')?.value;
  const btn   = document.getElementById('hv-btn');
  const err   = document.getElementById('hv-err');
  err.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Anmeldung …';

  try {
    const res = await fetch(`${SB}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: { apikey: KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pw })
    });
    const d = await res.json();
    if (!d.access_token) { err.classList.add('show'); btn.disabled = false; btn.textContent = 'Anmelden'; document.getElementById('hv-pw').value = ''; return; }
    hvToken   = d.access_token;
    hvExp     = Date.now() + d.expires_in * 1000;
    hvSession = { email };
    loadHvReporting();
  } catch {
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Anmelden';
  }
}

async function loadHvReporting() {
  document.getElementById('content').innerHTML = '<div class="loading">Reporting wird geladen …</div>';

  try {
    const res = await fetch(`${SB}/rest/v1/schaden?order=datum.desc&limit=200`, {
      headers: { apikey: KEY, Authorization: `Bearer ${hvToken}` }
    });
    if (!res.ok) throw new Error('fetch');
    const data = await res.json();

    const offen    = data.filter(s => s.status === 'Offen').length;
    const inArbeit = data.filter(s => s.status === 'In Bearbeitung').length;
    const erledigt = data.filter(s => s.status === 'Erledigt').length;

    const recent = data.slice(0, 20);

    document.getElementById('content').innerHTML = `
      <div class="mm-logout">
        <div>
          <div class="mm-user-label">Hausverwaltung</div>
          <div class="mm-user-name">${hvSession.email}</div>
        </div>
        <button class="btn-logout" onclick="hvLogout()">Abmelden</button>
      </div>

      <div class="report-section">
        <div class="report-section-title">Übersicht</div>
        <div class="stat-row">
          <div class="stat-card"><div class="stat-num offen">${offen}</div><div class="stat-lbl">Offen</div></div>
          <div class="stat-card"><div class="stat-num" style="color:#1d4ed8">${inArbeit}</div><div class="stat-lbl">In Arbeit</div></div>
          <div class="stat-card"><div class="stat-num ok">${erledigt}</div><div class="stat-lbl">Erledigt</div></div>
        </div>
      </div>

      <div class="report-section">
        <div class="report-section-title">Aktuelle Meldungen (${data.length} gesamt)</div>
        <div class="report-table-wrap">
          <table class="report-table">
            <thead><tr><th>Datum</th><th>Bereich</th><th>Problem</th><th>Status</th></tr></thead>
            <tbody>
              ${recent.map(s => `<tr>
                <td style="white-space:nowrap;color:var(--text-muted)">${s.datum||'—'}</td>
                <td style="white-space:nowrap">${s.ort||'—'}</td>
                <td style="color:var(--text-muted)">${(s.problem||'').slice(0,60)}${(s.problem||'').length>60?'…':''}</td>
                <td><span class="status-pill status-${(s.status||'Offen').replace(/\s/g,'-')}">${s.status||'Offen'}</span></td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
  } catch {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <div>Fehler beim Laden des Reportings.</div>
        <button class="btn-full" style="margin-top:16px" onclick="hvLogout()">Neu anmelden</button>
      </div>`;
  }
}

function hvLogout() {
  hvToken = null; hvExp = 0; hvSession = null;
  showTab('meine');
}

// ── Init ──────────────────────────────────────────────────────────────────────
showTab('melden');
</script>
</body>
</html>
