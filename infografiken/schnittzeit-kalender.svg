<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>
  <text x="300" y="24" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Schnittzeiten: Was wann erlaubt ist</text>

  <!-- Kopfzeile Monate -->
  <rect x="130" y="32" width="440" height="18" fill="#1C4A2E" opacity="0.1" rx="3"/>
  <text x="165" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Jan</text>
  <text x="202" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Feb</text>
  <text x="239" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Mär</text>
  <text x="276" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Apr</text>
  <text x="313" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Mai</text>
  <text x="350" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Jun</text>
  <text x="387" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Jul</text>
  <text x="424" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Aug</text>
  <text x="461" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Sep</text>
  <text x="498" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Okt</text>
  <text x="535" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Nov</text>
  <text x="572" y="44" text-anchor="middle" font-size="8" font-weight="700" fill="#1C4A2E">Dez</text>

  <!-- Gitter -->
  <g stroke="#e0d8cc" stroke-width="0.5">
    <line x1="183" y1="50" x2="183" y2="248"/>
    <line x1="220" y1="50" x2="220" y2="248"/>
    <line x1="257" y1="50" x2="257" y2="248"/>
    <line x1="294" y1="50" x2="294" y2="248"/>
    <line x1="331" y1="50" x2="331" y2="248"/>
    <line x1="368" y1="50" x2="368" y2="248"/>
    <line x1="405" y1="50" x2="405" y2="248"/>
    <line x1="442" y1="50" x2="442" y2="248"/>
    <line x1="479" y1="50" x2="479" y2="248"/>
    <line x1="516" y1="50" x2="516" y2="248"/>
    <line x1="553" y1="50" x2="553" y2="248"/>
  </g>

  <!-- Zeile: Hecken (formschnitt) -->
  <text x="128" y="68" text-anchor="end" font-size="10" fill="#1C4A2E">Hecken</text>
  <text x="128" y="79" text-anchor="end" font-size="8" fill="#888">Formschnitt</text>
  <!-- Erlaubt Jan-Feb -->
  <rect x="147" y="57" width="73" height="16" rx="3" fill="#2d7a3a" opacity="0.5"/>
  <text x="183" y="68" text-anchor="middle" font-size="7" fill="#1C4A2E">Formschnitt ✓</text>
  <!-- Verboten: März-Jul (Brutzeit) -->
  <rect x="220" y="57" width="185" height="16" rx="3" fill="#7A2430" opacity="0.2"/>
  <text x="312" y="68" text-anchor="middle" font-size="7" fill="#7A2430" font-weight="600">⚠ Brutzeit — nur Einzelschnitt erlaubt</text>
  <!-- Erlaubt Aug -->
  <rect x="405" y="57" width="37" height="16" rx="3" fill="#2d7a3a"/>
  <text x="423" y="68" text-anchor="middle" font-size="7" fill="#fff">Aug ✓</text>
  <!-- Sep-Dez erlaubt -->
  <rect x="442" y="57" width="148" height="16" rx="3" fill="#2d7a3a" opacity="0.5"/>
  <text x="516" y="68" text-anchor="middle" font-size="7" fill="#1C4A2E">Herbstschnitt ✓</text>

  <!-- Zeile: Sträucher -->
  <text x="128" y="103" text-anchor="end" font-size="10" fill="#1C4A2E">Sträucher</text>
  <text x="128" y="114" text-anchor="end" font-size="8" fill="#888">Blühend</text>
  <!-- Nach Blüte (Sommerblüher) -->
  <rect x="147" y="92" width="110" height="16" rx="3" fill="#2d7a3a" opacity="0.5"/>
  <text x="202" y="103" text-anchor="middle" font-size="7" fill="#1C4A2E">Frühlingsblüher: direkt nach Blüte</text>
  <rect x="368" y="92" width="222" height="16" rx="3" fill="#3a9a4a" opacity="0.4"/>
  <text x="479" y="103" text-anchor="middle" font-size="7" fill="#1C4A2E">Sommerblüher: Herbst/Winter</text>

  <!-- Zeile: Obstbäume Kernobst -->
  <text x="128" y="138" text-anchor="end" font-size="10" fill="#1C4A2E">Kernobst</text>
  <text x="128" y="149" text-anchor="end" font-size="8" fill="#888">Apfel, Birne</text>
  <rect x="147" y="127" width="146" height="16" rx="3" fill="#2d7a3a"/>
  <text x="220" y="138" text-anchor="middle" font-size="7" fill="#fff" font-weight="600">Jan–März ★ Hauptschnitt</text>
  <rect x="368" y="127" width="222" height="16" rx="3" fill="#2d7a3a" opacity="0.3"/>
  <text x="479" y="138" text-anchor="middle" font-size="7" fill="#1C4A2E">Sommerauslichtung möglich</text>

  <!-- Zeile: Steinobst -->
  <text x="128" y="173" text-anchor="end" font-size="10" fill="#1C4A2E">Steinobst</text>
  <text x="128" y="184" text-anchor="end" font-size="8" fill="#888">Kirsche, Pflaume</text>
  <rect x="147" y="162" width="184" height="16" rx="3" fill="#7A2430" opacity="0.2"/>
  <text x="239" y="173" text-anchor="middle" font-size="7" fill="#7A2430">Schnitt im Winter riskant (Krankheiten)</text>
  <rect x="331" y="162" width="111" height="16" rx="3" fill="#2d7a3a"/>
  <text x="386" y="173" text-anchor="middle" font-size="7" fill="#fff" font-weight="600">Nach Ernte ★ Ideal</text>

  <!-- Zeile: Rosen -->
  <text x="128" y="208" text-anchor="end" font-size="10" fill="#1C4A2E">Rosen</text>
  <text x="128" y="219" text-anchor="end" font-size="8" fill="#888">Beetrosen</text>
  <rect x="147" y="197" width="73" height="16" rx="3" fill="#7A2430" opacity="0.15"/>
  <text x="183" y="208" text-anchor="middle" font-size="7" fill="#7A2430">zu kalt</text>
  <rect x="220" y="197" width="74" height="16" rx="3" fill="#2d7a3a"/>
  <text x="257" y="208" text-anchor="middle" font-size="7" fill="#fff" font-weight="600">März ★</text>
  <rect x="294" y="197" width="222" height="16" rx="3" fill="#3a9a4a" opacity="0.3"/>
  <text x="405" y="208" text-anchor="middle" font-size="7" fill="#1C4A2E">Verblühtes entfernen</text>
  <rect x="516" y="197" width="74" height="16" rx="3" fill="#7A2430" opacity="0.3"/>
  <text x="553" y="208" text-anchor="middle" font-size="7" fill="#7A2430">Rückschnitt Nov</text>

  <!-- Legende -->
  <rect x="30" y="255" width="540" height="36" rx="8" fill="#1C4A2E" opacity="0.07"/>
  <rect x="44" y="264" width="16" height="10" rx="2" fill="#2d7a3a"/>
  <text x="65" y="273" font-size="10" fill="#555">Schnitt empfohlen</text>
  <rect x="180" y="264" width="16" height="10" rx="2" fill="#2d7a3a" opacity="0.4"/>
  <text x="201" y="273" font-size="10" fill="#555">Schnitt möglich</text>
  <rect x="310" y="264" width="16" height="10" rx="2" fill="#7A2430" opacity="0.3"/>
  <text x="331" y="273" font-size="10" fill="#555">Nicht empfohlen</text>
  <text x="300" y="287" text-anchor="middle" font-size="10" fill="#7A2430" font-weight="600">§ BNatSchG: Hecken &amp; Sträucher März–September NUR als Pflegeschnitt, kein Kahlschnitt!</text>
</svg>
