<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>

  <!-- Titel -->
  <text x="300" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Schnitthöhe: Sommer vs. Winter</text>

  <!-- SOMMER -->
  <text x="150" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#1C4A2E">Hochsommer</text>

  <!-- Boden -->
  <rect x="30" y="210" width="240" height="60" fill="#8B6914" rx="0"/>
  <rect x="30" y="200" width="240" height="12" fill="#4a7c2f" rx="0"/>

  <!-- Grashalme Sommer (höher, 5-6 cm) -->
  <g stroke="#2d7a3a" stroke-width="2.5" stroke-linecap="round">
    <line x1="55" y1="200" x2="52" y2="140"/>
    <line x1="70" y1="200" x2="73" y2="135"/>
    <line x1="85" y1="200" x2="82" y2="138"/>
    <line x1="100" y1="200" x2="103" y2="132"/>
    <line x1="115" y1="200" x2="112" y2="137"/>
    <line x1="130" y1="200" x2="133" y2="133"/>
    <line x1="145" y1="200" x2="142" y2="136"/>
    <line x1="160" y1="200" x2="163" y2="131"/>
    <line x1="175" y1="200" x2="172" y2="138"/>
    <line x1="190" y1="200" x2="193" y2="134"/>
    <line x1="205" y1="200" x2="202" y2="137"/>
    <line x1="220" y1="200" x2="223" y2="133"/>
    <line x1="235" y1="200" x2="232" y2="139"/>
    <line x1="250" y1="200" x2="247" y2="135"/>
  </g>

  <!-- Pfeil Höhe Sommer -->
  <line x1="22" y1="135" x2="22" y2="200" stroke="#1C4A2E" stroke-width="1.5" marker-end="url(#arr)" marker-start="url(#arrs)"/>
  <text x="16" y="172" text-anchor="middle" font-size="11" fill="#1C4A2E" transform="rotate(-90,16,172)">5–6 cm</text>

  <!-- Schatten unterm Gras -->
  <rect x="30" y="185" width="240" height="15" fill="#1C4A2E" opacity="0.15"/>
  <text x="150" y="178" text-anchor="middle" font-size="10" fill="#2d7a3a" font-weight="600">Boden im Schatten = weniger Verdunstung</text>

  <!-- Wurzeln Sommer (tiefer) -->
  <g stroke="#7a5c1e" stroke-width="1.2" opacity="0.7">
    <line x1="80" y1="212" x2="75" y2="250"/> <line x1="80" y1="212" x2="85" y2="255"/>
    <line x1="130" y1="212" x2="125" y2="248"/> <line x1="130" y1="212" x2="135" y2="252"/>
    <line x1="180" y1="212" x2="175" y2="253"/> <line x1="180" y1="212" x2="185" y2="249"/>
    <line x1="230" y1="212" x2="225" y2="251"/> <line x1="230" y1="212" x2="235" y2="254"/>
  </g>
  <text x="150" y="268" text-anchor="middle" font-size="10" fill="#7a5c1e">Tiefe Wurzeln</text>

  <!-- WINTER -->
  <text x="450" y="58" text-anchor="middle" font-size="12" font-weight="600" fill="#555">Winter / Frühjahr</text>

  <!-- Boden Winter -->
  <rect x="330" y="210" width="240" height="60" fill="#8B6914" rx="0"/>
  <rect x="330" y="200" width="240" height="12" fill="#4a7c2f" rx="0"/>

  <!-- Grashalme Winter (kürzer, 4-5cm) -->
  <g stroke="#4a9a5a" stroke-width="2.5" stroke-linecap="round">
    <line x1="355" y1="200" x2="352" y2="160"/>
    <line x1="370" y1="200" x2="373" y2="155"/>
    <line x1="385" y1="200" x2="382" y2="158"/>
    <line x1="400" y1="200" x2="403" y2="153"/>
    <line x1="415" y1="200" x2="412" y2="157"/>
    <line x1="430" y1="200" x2="433" y2="152"/>
    <line x1="445" y1="200" x2="442" y2="156"/>
    <line x1="460" y1="200" x2="463" y2="151"/>
    <line x1="475" y1="200" x2="472" y2="158"/>
    <line x1="490" y1="200" x2="493" y2="154"/>
    <line x1="505" y1="200" x2="502" y2="157"/>
    <line x1="520" y1="200" x2="523" y2="153"/>
    <line x1="535" y1="200" x2="532" y2="159"/>
    <line x1="550" y1="200" x2="547" y2="155"/>
  </g>

  <!-- Pfeil Höhe Winter -->
  <line x1="322" y1="153" x2="322" y2="200" stroke="#555" stroke-width="1.5" marker-end="url(#arr2)" marker-start="url(#arrs2)"/>
  <text x="316" y="180" text-anchor="middle" font-size="11" fill="#555" transform="rotate(-90,316,180)">4–5 cm</text>

  <!-- Wurzeln Winter (flacher) -->
  <g stroke="#7a5c1e" stroke-width="1.2" opacity="0.5">
    <line x1="380" y1="212" x2="376" y2="235"/> <line x1="380" y1="212" x2="384" y2="238"/>
    <line x1="430" y1="212" x2="426" y2="233"/> <line x1="430" y1="212" x2="434" y2="236"/>
    <line x1="480" y1="212" x2="476" y2="234"/> <line x1="480" y1="212" x2="484" y2="237"/>
    <line x1="530" y1="212" x2="526" y2="235"/> <line x1="530" y1="212" x2="534" y2="238"/>
  </g>
  <text x="450" y="255" text-anchor="middle" font-size="10" fill="#7a5c1e" opacity="0.7">Flachere Wurzeln</text>

  <!-- Trennlinie -->
  <line x1="300" y1="50" x2="300" y2="285" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bewertung -->
  <rect x="50" y="278" width="120" height="18" rx="9" fill="#1C4A2E"/>
  <text x="110" y="291" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">✓ Empfohlen</text>
  <rect x="370" y="278" width="120" height="18" rx="9" fill="#888"/>
  <text x="430" y="291" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">Normal</text>

  <!-- Pfeildefinitionen -->
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#1C4A2E" stroke-width="1"/>
    </marker>
    <marker id="arrs" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#1C4A2E" stroke-width="1"/>
    </marker>
    <marker id="arr2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
    <marker id="arrs2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#555" stroke-width="1"/>
    </marker>
  </defs>
</svg>
