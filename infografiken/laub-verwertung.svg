<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Herbstlaub: Weg damit — oder stehen lassen?</text>

  <!-- Rasen: weg -->
  <g transform="translate(90,50)">
    <rect x="-70" y="0" width="140" height="195" rx="8" fill="#7A2430" opacity="0.08"/>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#7A2430">🌿 Vom Rasen</text>
    <text x="0" y="32" text-anchor="middle" font-size="10" fill="#7A2430" font-weight="600">→ täglich entfernen</text>
    <!-- Laub auf Rasen -->
    <ellipse cx="-20" cy="65" rx="18" ry="10" fill="#B8892A" opacity="0.7"/>
    <ellipse cx="10" cy="72" rx="15" ry="9" fill="#c0522a" opacity="0.7"/>
    <ellipse cx="-5" cy="80" rx="20" ry="8" fill="#8B6914" opacity="0.6"/>
    <rect x="-40" y="83" width="80" height="8" fill="#4a7c2f" rx="2"/>
    <!-- Rechen -->
    <line x1="30" y1="45" x2="20" y2="90" stroke="#555" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="14" y1="88" x2="26" y2="92" stroke="#555" stroke-width="2"/>
    <line x1="16" y1="91" x2="19" y2="83" stroke="#555" stroke-width="1.5"/>
    <line x1="20" y1="92" x2="23" y2="84" stroke="#555" stroke-width="1.5"/>
    <line x1="24" y1="92" x2="27" y2="84" stroke="#555" stroke-width="1.5"/>
    <text x="0" y="113" text-anchor="middle" font-size="9" fill="#7A2430">Dicke Schicht erstickt</text>
    <text x="0" y="126" text-anchor="middle" font-size="9" fill="#7A2430">den Rasen</text>
    <text x="0" y="143" text-anchor="middle" font-size="9" fill="#555">→ auf Kompost</text>
    <text x="0" y="156" text-anchor="middle" font-size="9" fill="#555">→ häckseln + einarbeiten</text>
    <text x="0" y="173" text-anchor="middle" font-size="9" fill="#555">Dünne Schicht: mit</text>
    <text x="0" y="185" text-anchor="middle" font-size="9" fill="#555">Mäher zerkleinern ✓</text>
  </g>

  <!-- Beete: schützt -->
  <g transform="translate(250,50)">
    <rect x="-70" y="0" width="140" height="195" rx="8" fill="#2d7a3a" opacity="0.08"/>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">🌱 Auf Beeten</text>
    <text x="0" y="32" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">→ als Mulch liegen lassen</text>
    <!-- Beet mit Laub -->
    <rect x="-45" y="78" width="90" height="22" rx="4" fill="#8B6914"/>
    <ellipse cx="-25" cy="74" rx="16" ry="9" fill="#B8892A" opacity="0.8"/>
    <ellipse cx="5" cy="70" rx="18" ry="10" fill="#c0522a" opacity="0.7"/>
    <ellipse cx="25" cy="74" rx="14" ry="8" fill="#8B6914" opacity="0.8"/>
    <!-- Frostschutz-Pfeil -->
    <path d="M-50,68 L-58,85" stroke="#4a90d9" stroke-width="1.5" marker-end="url(#arr3)"/>
    <text x="-62" y="62" font-size="8" fill="#4a90d9">Frost-</text>
    <text x="-62" y="72" font-size="8" fill="#4a90d9">schutz</text>
    <text x="0" y="116" text-anchor="middle" font-size="9" fill="#1C4A2E">Schützt Wurzeln</text>
    <text x="0" y="129" text-anchor="middle" font-size="9" fill="#1C4A2E">vor Frost</text>
    <text x="0" y="146" text-anchor="middle" font-size="9" fill="#555">Zersetzt sich zu</text>
    <text x="0" y="159" text-anchor="middle" font-size="9" fill="#555">wertvollem Humus</text>
    <text x="0" y="176" text-anchor="middle" font-size="9" fill="#555">Nicht zu dick!</text>
    <text x="0" y="188" text-anchor="middle" font-size="9" fill="#555">Max 10 cm</text>
  </g>

  <!-- Laubhaufen: Igel -->
  <g transform="translate(420,50)">
    <rect x="-80" y="0" width="160" height="195" rx="8" fill="#B8892A" opacity="0.08"/>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#8B6914">🦔 Laubhaufen</text>
    <text x="0" y="32" text-anchor="middle" font-size="10" fill="#8B6914" font-weight="600">→ stehen lassen!</text>
    <!-- Laubhaufen -->
    <ellipse cx="0" cy="82" rx="50" ry="25" fill="#B8892A" opacity="0.7"/>
    <ellipse cx="-15" cy="75" rx="25" ry="15" fill="#c0522a" opacity="0.5"/>
    <!-- Igel im Haufen -->
    <ellipse cx="10" cy="83" rx="18" ry="12" fill="#555" opacity="0.7"/>
    <text x="10" y="87" text-anchor="middle" font-size="14">🦔</text>
    <text x="0" y="118" text-anchor="middle" font-size="9" fill="#8B6914">Winterquartier für</text>
    <text x="0" y="131" text-anchor="middle" font-size="9" fill="#8B6914">Igel, Kröten, Insekten</text>
    <text x="0" y="148" text-anchor="middle" font-size="9" fill="#555">In Ecken und unter</text>
    <text x="0" y="161" text-anchor="middle" font-size="9" fill="#555">Hecken platzieren</text>
    <text x="0" y="178" text-anchor="middle" font-size="9" fill="#555">Erst im März</text>
    <text x="0" y="190" text-anchor="middle" font-size="9" fill="#555">aufräumen</text>
  </g>

  <defs>
    <marker id="arr3" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6" fill="none" stroke="#4a90d9" stroke-width="1"/>
    </marker>
  </defs>

  <!-- Trennlinien -->
  <line x1="175" y1="45" x2="175" y2="252" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="345" y1="45" x2="345" y2="252" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Unten -->
  <rect x="30" y="258" width="540" height="32" rx="8" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="273" text-anchor="middle" font-size="11" fill="#1C4A2E" font-weight="700">Laub vom Rasen: täglich oder alle 2 Tage · Beete: liegen lassen · Ecken: Laubhaufen anlegen</text>
  <text x="300" y="287" text-anchor="middle" font-size="10" fill="#555">Nusslaub (Walnuss) und krankes Laub (Schorf) NICHT kompostieren — in Biotonne</text>
</svg>
