<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Laubhaufen im Park — wer überwintert darin?</text>
  <text x="300" y="42" text-anchor="middle" font-size="10" fill="#555">Ein Laubhaufen in der Ecke ist kein Chaos — er ist ein Winterquartier</text>

  <!-- Laubhaufen Illustration zentral -->
  <ellipse cx="300" cy="200" rx="180" ry="55" fill="#8B6914" opacity="0.35"/>
  <ellipse cx="300" cy="195" rx="165" ry="48" fill="#B8892A" opacity="0.3"/>
  <ellipse cx="300" cy="188" rx="140" ry="38" fill="#c0a060" opacity="0.35"/>
  <!-- Laub-Texturen -->
  <text x="190" y="198" font-size="16">🍂</text>
  <text x="220" y="188" font-size="14">🍁</text>
  <text x="255" y="202" font-size="16">🍂</text>
  <text x="285" y="186" font-size="14">🍁</text>
  <text x="318" y="198" font-size="16">🍂</text>
  <text x="350" y="189" font-size="14">🍁</text>
  <text x="375" y="200" font-size="16">🍂</text>

  <!-- Bewohner des Laubhaufens mit Pfeilen -->

  <!-- Igel -->
  <text x="110" y="82" text-anchor="middle" font-size="28">🦔</text>
  <text x="110" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#6B4423">Igel</text>
  <text x="110" y="115" text-anchor="middle" font-size="9" fill="#555">Winterschlaf</text>
  <text x="110" y="127" text-anchor="middle" font-size="9" fill="#555">Nov – März</text>
  <line x1="145" y1="138" x2="195" y2="175" stroke="#6B4423" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Erdkröte -->
  <text x="220" y="82" text-anchor="middle" font-size="26">🐸</text>
  <text x="220" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#3a9a4a">Erdkröte</text>
  <text x="220" y="115" text-anchor="middle" font-size="9" fill="#555">Winterruhe</text>
  <text x="220" y="127" text-anchor="middle" font-size="9" fill="#555">tief im Laub</text>
  <line x1="222" y1="134" x2="245" y2="168" stroke="#3a9a4a" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Marienkäfer/Insekten -->
  <text x="380" y="82" text-anchor="middle" font-size="26">🐞</text>
  <text x="380" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#7A2430">Marienkäfer</text>
  <text x="380" y="115" text-anchor="middle" font-size="9" fill="#555">+100 Insekten-</text>
  <text x="380" y="127" text-anchor="middle" font-size="9" fill="#555">arten überwintern</text>
  <line x1="357" y1="134" x2="330" y2="172" stroke="#7A2430" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Blindschleiche -->
  <text x="490" y="82" text-anchor="middle" font-size="26">🐍</text>
  <text x="490" y="102" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Blindschleiche</text>
  <text x="490" y="115" text-anchor="middle" font-size="9" fill="#555">harmlose Eidechse</text>
  <text x="490" y="127" text-anchor="middle" font-size="9" fill="#555">frisst Schnecken!</text>
  <line x1="460" y1="134" x2="390" y2="173" stroke="#1C4A2E" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Regeln für Laubhaufen im Park -->
  <rect x="20" y="250" width="560" height="62" rx="8" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="268" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">So legen wir Laubhaufen im Park an:</text>

  <text x="80"  y="290" text-anchor="middle" font-size="22">📍</text>
  <text x="80"  y="306" text-anchor="middle" font-size="9" fill="#555">Ruhige Ecke</text>
  <text x="80"  y="316" text-anchor="middle" font-size="9" fill="#555">abseits der Wege</text>

  <text x="185" y="290" text-anchor="middle" font-size="22">📐</text>
  <text x="185" y="306" text-anchor="middle" font-size="9" fill="#555">Mind. 1 m×1 m</text>
  <text x="185" y="316" text-anchor="middle" font-size="9" fill="#555">und 50 cm hoch</text>

  <text x="300" y="290" text-anchor="middle" font-size="22">🚫</text>
  <text x="300" y="306" text-anchor="middle" font-size="9" fill="#555">Bis März</text>
  <text x="300" y="316" text-anchor="middle" font-size="9" fill="#555">NICHT entfernen</text>

  <text x="415" y="290" text-anchor="middle" font-size="22">🪵</text>
  <text x="415" y="306" text-anchor="middle" font-size="9" fill="#555">Äste dazulegen</text>
  <text x="415" y="316" text-anchor="middle" font-size="9" fill="#555">für Struktur</text>

  <text x="520" y="290" text-anchor="middle" font-size="22">🏷️</text>
  <text x="520" y="306" text-anchor="middle" font-size="9" fill="#B8892A" font-weight="600">Schild aufstellen</text>
  <text x="520" y="316" text-anchor="middle" font-size="9" fill="#555">»Winterquartier«</text>
</svg>
