<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="310" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#7A2430">Buchsbaumzünsler: Früh erkennen — sofort handeln</text>

  <!-- Buchsbaum gesund vs. befallen -->
  <!-- Links: befallen -->
  <text x="150" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#7A2430">Befallen — 5 Warnsignale</text>

  <!-- Buchsbaum-Silhouette befallen -->
  <ellipse cx="150" cy="155" rx="88" ry="80" fill="#5a7a3a" opacity="0.5"/>
  <!-- Kahle braune Stellen -->
  <ellipse cx="110" cy="120" rx="30" ry="22" fill="#8B6914" opacity="0.7"/>
  <ellipse cx="175" cy="170" rx="25" ry="18" fill="#8B6914" opacity="0.6"/>
  <ellipse cx="130" cy="185" rx="20" ry="15" fill="#c0522a" opacity="0.5"/>

  <!-- Callout-Linien -->
  <line x1="92"  y1="108" x2="42"  y2="88"  stroke="#7A2430" stroke-width="1.5"/>
  <text x="40"  y="83"  text-anchor="end" font-size="9" fill="#7A2430" font-weight="600">① Fraßschäden</text>
  <text x="40"  y="95"  text-anchor="end" font-size="8" fill="#555">Blätter skelettiert</text>

  <line x1="185" y1="128" x2="245" y2="100" stroke="#7A2430" stroke-width="1.5"/>
  <text x="248" y="96"  font-size="9" fill="#7A2430" font-weight="600">② Gespinst</text>
  <text x="248" y="108" font-size="8" fill="#555">Weiße Fäden</text>

  <line x1="150" y1="75"  x2="150" y2="48"  stroke="#7A2430" stroke-width="1.5"/>
  <text x="150" y="43"  text-anchor="middle" font-size="9" fill="#7A2430" font-weight="600">③ Kotkügelchen (grün)</text>

  <line x1="190" y1="185" x2="245" y2="195" stroke="#7A2430" stroke-width="1.5"/>
  <text x="248" y="192" font-size="9" fill="#7A2430" font-weight="600">④ Raupen (grün-weiß)</text>
  <text x="248" y="204" font-size="8" fill="#555">mit schwarzem Kopf</text>

  <line x1="115" y1="205" x2="60" y2="225" stroke="#7A2430" stroke-width="1.5"/>
  <text x="57"  y="222" text-anchor="end" font-size="9" fill="#7A2430" font-weight="600">⑤ Totäste</text>
  <text x="57"  y="234" text-anchor="end" font-size="8" fill="#555">braune Zweige</text>

  <!-- Schmetterling / Falter -->
  <text x="215" y="145" font-size="20">🦋</text>
  <text x="215" y="162" text-anchor="middle" font-size="7" fill="#555">Falter: weiß</text>
  <text x="215" y="172" text-anchor="middle" font-size="7" fill="#555">braun umrandet</text>

  <!-- Rechts: Maßnahmen -->
  <text x="450" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Sofortmaßnahmen</text>

  <!-- Schritt 1 -->
  <rect x="310" y="58" width="260" height="38" rx="7" fill="#7A2430" opacity="0.1"/>
  <text x="320" y="74" font-size="22">🔍</text>
  <text x="350" y="72" font-size="10" font-weight="700" fill="#7A2430">1. Befall einschätzen</text>
  <text x="350" y="86" font-size="9" fill="#555">Unter ⅓ befallen: noch zu retten</text>

  <!-- Schritt 2 -->
  <rect x="310" y="104" width="260" height="38" rx="7" fill="#B8892A" opacity="0.1"/>
  <text x="320" y="120" font-size="22">🪣</text>
  <text x="350" y="118" font-size="10" font-weight="700" fill="#8B6914">2. Abspritzen mit Wasser</text>
  <text x="350" y="132" font-size="9" fill="#555">Raupen mit Wasserstrahl abspülen</text>

  <!-- Schritt 3 -->
  <rect x="310" y="150" width="260" height="38" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="320" y="166" font-size="22">🌿</text>
  <text x="350" y="164" font-size="10" font-weight="700" fill="#1C4A2E">3. Bacillus thuringiensis</text>
  <text x="350" y="178" font-size="9" fill="#555">Bio-Mittel, Bienen-unbedenklich</text>

  <!-- Schritt 4 -->
  <rect x="310" y="196" width="260" height="38" rx="7" fill="#4a90d9" opacity="0.08"/>
  <text x="320" y="212" font-size="22">✂️</text>
  <text x="350" y="210" font-size="10" font-weight="700" fill="#4a90d9">4. Stark befallene Triebe</text>
  <text x="350" y="224" font-size="9" fill="#555">Rückschnitt + in Mülltonne (nicht Kompost)</text>

  <!-- Schritt 5 -->
  <rect x="310" y="242" width="260" height="38" rx="7" fill="#3a9a4a" opacity="0.1"/>
  <text x="320" y="258" font-size="22">📅</text>
  <text x="350" y="256" font-size="10" font-weight="700" fill="#3a9a4a">5. 3 Generationen/Jahr</text>
  <text x="350" y="270" font-size="9" fill="#555">April · Juni/Juli · Aug/Sep — alle 3 behandeln</text>

  <line x1="300" y1="42" x2="300" y2="286" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="30" y="289" width="540" height="16" rx="6" fill="#1C4A2E" opacity="0.08"/>
  <text x="300" y="301" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Für Bewohner sichtbar: weißes Gespinst im Buchsbaum = sofort melden!</text>
</svg>
