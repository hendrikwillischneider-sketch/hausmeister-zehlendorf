<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">November: Rasen geht in Winterruhe — was das bedeutet</text>

  <!-- Links: Temperatur-Grenze -->
  <text x="145" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Wann hört das Wachstum auf?</text>

  <!-- Thermometer -->
  <rect x="108" y="68" width="18" height="100" rx="9" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <rect x="110" y="118" width="14" height="50" rx="7" fill="#4a90d9"/>
  <circle cx="117" cy="172" r="12" fill="#4a90d9"/>
  <text x="117" y="176" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">5°</text>
  <!-- Markierung -->
  <line x1="126" y1="118" x2="148" y2="112" stroke="#7A2430" stroke-width="1.5"/>
  <text x="152" y="115" font-size="10" fill="#7A2430" font-weight="700">5 °C</text>
  <text x="152" y="128" font-size="9" fill="#7A2430">Wachstum stoppt</text>
  <text x="152" y="140" font-size="9" fill="#555">kein Mähen mehr sinnvoll</text>

  <line x1="126" y1="90" x2="148" y2="78" stroke="#B8892A" stroke-width="1.5"/>
  <text x="152" y="76" font-size="10" fill="#B8892A" font-weight="700">0 °C</text>
  <text x="152" y="88" font-size="9" fill="#B8892A">Boden gefriert</text>
  <text x="152" y="100" font-size="9" fill="#555">NIE betreten!</text>

  <!-- Rasenfläche eingesclafen -->
  <rect x="30" y="210" width="240" height="20" fill="#8B6914" opacity="0.35"/>
  <rect x="30" y="200" width="240" height="12" fill="#3a7a2a" opacity="0.5"/>
  <g stroke="#2d6a20" stroke-width="2" stroke-linecap="round">
    <line x1="55"  y1="200" x2="53"  y2="180"/>
    <line x1="80"  y1="200" x2="82"  y2="178"/>
    <line x1="105" y1="200" x2="103" y2="181"/>
    <line x1="130" y1="200" x2="132" y2="178"/>
    <line x1="155" y1="200" x2="153" y2="180"/>
    <line x1="180" y1="200" x2="182" y2="177"/>
    <line x1="205" y1="200" x2="203" y2="180"/>
    <line x1="230" y1="200" x2="232" y2="178"/>
    <line x1="255" y1="200" x2="253" y2="181"/>
  </g>
  <!-- Frost-Overlay -->
  <rect x="30" y="178" width="240" height="22" fill="#aaddff" opacity="0.25"/>
  <text x="150" y="252" text-anchor="middle" font-size="10" fill="#555">5–6 cm Winterhöhe</text>
  <text x="150" y="266" text-anchor="middle" font-size="9" fill="#555">schützt Wurzeln wie eine Decke</text>

  <!-- TRENNLINIE -->
  <line x1="300" y1="44" x2="300" y2="290" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Rechts: Was tun / nicht tun -->
  <text x="450" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">November-Regeln für den Rasen</text>

  <g transform="translate(312, 62)">
    <!-- TUN -->
    <rect x="0" y="0" width="268" height="32" rx="6" fill="#3a9a4a" opacity="0.12"/>
    <text x="12" y="15" font-size="18">✓</text>
    <text x="32" y="14" font-size="10" font-weight="700" fill="#1C4A2E">Laub regelmäßig entfernen</text>
    <text x="32" y="27" font-size="9" fill="#555">Laub = Fäulnis und Pilzkrankheiten unter dem Gras</text>

    <rect x="0" y="38" width="268" height="32" rx="6" fill="#3a9a4a" opacity="0.10"/>
    <text x="12" y="53" font-size="18">✓</text>
    <text x="32" y="52" font-size="10" font-weight="700" fill="#1C4A2E">Wege &amp; Ränder freihalten</text>
    <text x="32" y="65" font-size="9" fill="#555">Rutschgefahr durch nasses Laub — besonders für Bewohnerinnen</text>

    <rect x="0" y="76" width="268" height="32" rx="6" fill="#3a9a4a" opacity="0.08"/>
    <text x="12" y="91" font-size="18">✓</text>
    <text x="32" y="90" font-size="10" font-weight="700" fill="#1C4A2E">Letzte Düngung geprüft?</text>
    <text x="32" y="103" font-size="9" fill="#555">Kalium-Herbstdünger stärkt Frost-Resistenz</text>

    <!-- NICHT TUN -->
    <rect x="0" y="118" width="268" height="32" rx="6" fill="#7A2430" opacity="0.08"/>
    <text x="12" y="133" font-size="18">✗</text>
    <text x="32" y="132" font-size="10" font-weight="700" fill="#7A2430">Nicht betreten bei Frost</text>
    <text x="32" y="145" font-size="9" fill="#555">Gefrorene Halme brechen — braune Spuren bleiben monatelang</text>

    <rect x="0" y="156" width="268" height="32" rx="6" fill="#7A2430" opacity="0.07"/>
    <text x="12" y="171" font-size="18">✗</text>
    <text x="32" y="170" font-size="10" font-weight="700" fill="#7A2430">Nicht mähen unter 5 °C</text>
    <text x="32" y="183" font-size="9" fill="#555">Schnitt stresst Pflanze — keine Zeit mehr zum Erholen</text>

    <rect x="0" y="194" width="268" height="32" rx="6" fill="#7A2430" opacity="0.06"/>
    <text x="12" y="209" font-size="18">✗</text>
    <text x="32" y="208" font-size="10" font-weight="700" fill="#7A2430">Nicht auf gefrorenem Boden fahren</text>
    <text x="32" y="221" font-size="9" fill="#555">Maschinen-Gewicht verdichtet den Boden irreversibel</text>
  </g>

  <rect x="20" y="293" width="560" height="22" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="308" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Für Bewohnerinnen: Der Rasen ruht jetzt — er kommt im März kräftiger zurück als er gegangen ist</text>
</svg>
