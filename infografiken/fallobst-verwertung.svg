<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="310" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Fallobst: Vier Wege — einer passt immer</text>

  <!-- Weg 1: Kompost -->
  <g transform="translate(75,50)">
    <rect x="-60" y="0" width="120" height="195" rx="8" fill="#8B6914" opacity="0.1"/>
    <text x="0" y="16" text-anchor="middle" font-size="28">🍂</text>
    <text x="0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Kompost</text>
    <!-- Komposthaufen -->
    <ellipse cx="0" cy="90" rx="45" ry="20" fill="#B8892A" opacity="0.5"/>
    <ellipse cx="-10" cy="82" rx="28" ry="15" fill="#8B6914" opacity="0.6"/>
    <ellipse cx="12" cy="85" rx="20" ry="12" fill="#B8892A" opacity="0.7"/>
    <text x="0" y="123" text-anchor="middle" font-size="9" fill="#555">Gesundes Fallobst</text>
    <text x="0" y="136" text-anchor="middle" font-size="9" fill="#555">auf den Kompost</text>
    <text x="0" y="153" text-anchor="middle" font-size="9" fill="#7A2430">✗ Kein krankes Obst</text>
    <text x="0" y="166" text-anchor="middle" font-size="9" fill="#7A2430">(Schorf, Monilia)</text>
    <text x="0" y="183" text-anchor="middle" font-size="9" fill="#555">→ in Biotonne</text>
  </g>

  <!-- Weg 2: Wildtiere -->
  <g transform="translate(210,50)">
    <rect x="-60" y="0" width="120" height="195" rx="8" fill="#2d7a3a" opacity="0.07"/>
    <text x="0" y="16" text-anchor="middle" font-size="28">🦔</text>
    <text x="0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Wildtiere</text>
    <!-- Apfel auf Boden -->
    <circle cx="-15" cy="85" r="16" fill="#c0522a" opacity="0.8"/>
    <circle cx="15" cy="90" r="14" fill="#B8892A" opacity="0.8"/>
    <text x="0" y="118" text-anchor="middle" font-size="9" fill="#555">Einen Teil liegen</text>
    <text x="0" y="131" text-anchor="middle" font-size="9" fill="#555">lassen für</text>
    <text x="0" y="144" text-anchor="middle" font-size="9" fill="#555">Igel, Vögel,</text>
    <text x="0" y="157" text-anchor="middle" font-size="9" fill="#555">Wespen, Schmetterlinge</text>
    <text x="0" y="174" text-anchor="middle" font-size="9" fill="#7A2430">⚠ Tägliches Aufsammeln</text>
    <text x="0" y="187" text-anchor="middle" font-size="9" fill="#7A2430">verhindert Schädlinge!</text>
  </g>

  <!-- Weg 3: Verarbeiten -->
  <g transform="translate(345,50)">
    <rect x="-60" y="0" width="120" height="195" rx="8" fill="#7A2430" opacity="0.07"/>
    <text x="0" y="16" text-anchor="middle" font-size="28">🍎</text>
    <text x="0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Verarbeiten</text>
    <text x="0" y="68" text-anchor="middle" font-size="10" fill="#555">Apfelsaft pressen</text>
    <text x="0" y="81" text-anchor="middle" font-size="10" fill="#555">Apfelmus kochen</text>
    <text x="0" y="94" text-anchor="middle" font-size="10" fill="#555">Dörren / Trocknen</text>
    <text x="0" y="107" text-anchor="middle" font-size="10" fill="#555">Essig ansetzen</text>
    <text x="0" y="120" text-anchor="middle" font-size="10" fill="#555">Most vergären</text>
    <line x1="-40" y1="130" x2="40" y2="130" stroke="#ddd" stroke-width="1"/>
    <text x="0" y="147" text-anchor="middle" font-size="9" fill="#7A2430">Nur einwandfreies</text>
    <text x="0" y="160" text-anchor="middle" font-size="9" fill="#7A2430">Obst verarbeiten</text>
    <text x="0" y="177" text-anchor="middle" font-size="9" fill="#555">Druckstellen</text>
    <text x="0" y="190" text-anchor="middle" font-size="9" fill="#555">vorher rausschneiden</text>
  </g>

  <!-- Weg 4: Lagerung -->
  <g transform="translate(490,50)">
    <rect x="-80" y="0" width="160" height="195" rx="8" fill="#4a90d9" opacity="0.07"/>
    <text x="0" y="16" text-anchor="middle" font-size="28">📦</text>
    <text x="0" y="36" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Lagern</text>
    <text x="0" y="62" text-anchor="middle" font-size="10" fill="#555">Feste Äpfel/Birnen</text>
    <text x="0" y="75" text-anchor="middle" font-size="10" fill="#555">kühl + dunkel</text>
    <text x="0" y="88" text-anchor="middle" font-size="10" fill="#555">Nicht nebeneinander</text>
    <text x="0" y="101" text-anchor="middle" font-size="10" fill="#555">(ein fauler macht</text>
    <text x="0" y="114" text-anchor="middle" font-size="10" fill="#555">alle kaputt)</text>
    <rect x="-40" y="122" width="80" height="16" rx="4" fill="#1C4A2E" opacity="0.15"/>
    <text x="0" y="134" text-anchor="middle" font-size="9" fill="#1C4A2E">4–8 °C optimal</text>
    <text x="0" y="153" text-anchor="middle" font-size="9" fill="#7A2430">Fallobst: max.</text>
    <text x="0" y="166" text-anchor="middle" font-size="9" fill="#7A2430">wenige Tage —</text>
    <text x="0" y="179" text-anchor="middle" font-size="9" fill="#7A2430">sofort verarbeiten</text>
    <text x="0" y="192" text-anchor="middle" font-size="9" fill="#7A2430">oder kompostieren</text>
  </g>

  <!-- Trennlinien -->
  <line x1="148" y1="45" x2="148" y2="252" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="283" y1="45" x2="283" y2="252" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="418" y1="45" x2="418" y2="252" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="30" y="258" width="540" height="40" rx="8" fill="#7A2430" opacity="0.08"/>
  <text x="300" y="273" text-anchor="middle" font-size="11" fill="#1C4A2E" font-weight="700">Warum täglich aufsammeln? Liegen bleibendes Fallobst lockt Schädlinge an und überträgt Pilzkrankheiten</text>
  <text x="300" y="289" text-anchor="middle" font-size="10" fill="#555">Apfelsägewespe, Monilia-Fruchtfäule, Apfelwickler — alle überwintern im Fallobs am Boden</text>
</svg>
