<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Blumenzwiebeln: Richtige Pflanztiefe</text>

  <!-- Boden-Oberfläche -->
  <rect x="30" y="50" width="540" height="240" fill="#8B6914" rx="0 0 8 8"/>
  <rect x="30" y="44" width="540" height="14" fill="#4a7c2f"/>

  <!-- Tiefenlinien mit Beschriftung -->
  <line x1="30" y1="92" x2="570" y2="92" stroke="#a07830" stroke-width="0.8" stroke-dasharray="3,4"/>
  <line x1="30" y1="130" x2="570" y2="130" stroke="#a07830" stroke-width="0.8" stroke-dasharray="3,4"/>
  <line x1="30" y1="170" x2="570" y2="170" stroke="#a07830" stroke-width="0.8" stroke-dasharray="3,4"/>

  <!-- Tiefenangaben links -->
  <text x="22" y="50" text-anchor="end" font-size="10" fill="#555">0 cm</text>
  <text x="22" y="95" text-anchor="end" font-size="10" fill="#555">5 cm</text>
  <text x="22" y="133" text-anchor="end" font-size="10" fill="#555">10 cm</text>
  <text x="22" y="173" text-anchor="end" font-size="10" fill="#555">15 cm</text>

  <!-- Messlineal links -->
  <line x1="28" y1="50" x2="28" y2="200" stroke="#888" stroke-width="1"/>
  <line x1="24" y1="50" x2="32" y2="50" stroke="#888" stroke-width="1"/>
  <line x1="24" y1="92" x2="32" y2="92" stroke="#888" stroke-width="1"/>
  <line x1="24" y1="130" x2="32" y2="130" stroke="#888" stroke-width="1"/>
  <line x1="24" y1="170" x2="32" y2="170" stroke="#888" stroke-width="1"/>

  <!-- KROKUS — 5–8 cm -->
  <g transform="translate(100,95)">
    <!-- Zwiebelform -->
    <ellipse cx="0" cy="12" rx="18" ry="22" fill="#9B6DB5" opacity="0.9"/>
    <ellipse cx="0" cy="6" rx="12" ry="8" fill="#B8892A" opacity="0.7"/>
    <!-- Wurzeln -->
    <line x1="-10" y1="30" x2="-16" y2="50" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="0" y1="33" x2="0" y2="52" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="10" y1="30" x2="16" y2="50" stroke="#5a3a00" stroke-width="1.2"/>
    <!-- Trieb nach oben -->
    <line x1="0" y1="-10" x2="0" y2="-35" stroke="#2d7a3a" stroke-width="2"/>
    <text x="0" y="-40" text-anchor="middle" font-size="12">🌸</text>
  </g>
  <text x="100" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Krokus</text>
  <text x="100" y="215" text-anchor="middle" font-size="10" fill="#f0d090">5–8 cm tief</text>
  <text x="100" y="228" text-anchor="middle" font-size="9" fill="#d4b870">Blüte: März</text>

  <!-- SCHNEEGLÖCKCHEN — 8 cm -->
  <g transform="translate(220,108)">
    <ellipse cx="0" cy="10" rx="12" ry="15" fill="#c8d8f0" opacity="0.9"/>
    <ellipse cx="0" cy="5" rx="8" ry="6" fill="#B8892A" opacity="0.7"/>
    <line x1="-7" y1="22" x2="-11" y2="40" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="0" y1="24" x2="0" y2="42" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="7" y1="22" x2="11" y2="40" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="0" y1="-8" x2="0" y2="-30" stroke="#2d7a3a" stroke-width="2"/>
    <text x="0" y="-35" text-anchor="middle" font-size="12">🌼</text>
  </g>
  <text x="220" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Schneegöckchen</text>
  <text x="220" y="215" text-anchor="middle" font-size="10" fill="#f0d090">6–8 cm tief</text>
  <text x="220" y="228" text-anchor="middle" font-size="9" fill="#d4b870">Blüte: Feb–März</text>

  <!-- NARZISSE — 12 cm -->
  <g transform="translate(360,140)">
    <ellipse cx="0" cy="14" rx="20" ry="26" fill="#e8c840" opacity="0.9"/>
    <ellipse cx="0" cy="6" rx="13" ry="9" fill="#B8892A" opacity="0.7"/>
    <line x1="-12" y1="36" x2="-18" y2="60" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="0" y1="40" x2="0" y2="62" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="12" y1="36" x2="18" y2="60" stroke="#5a3a00" stroke-width="1.2"/>
    <line x1="0" y1="-12" x2="0" y2="-40" stroke="#2d7a3a" stroke-width="2.5"/>
    <text x="0" y="-45" text-anchor="middle" font-size="13">🌼</text>
  </g>
  <text x="360" y="260" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Narzisse</text>
  <text x="360" y="275" text-anchor="middle" font-size="10" fill="#f0d090">10–12 cm tief</text>
  <text x="360" y="288" text-anchor="middle" font-size="9" fill="#d4b870">Blüte: März–April</text>

  <!-- TULPE — 15 cm -->
  <g transform="translate(500,175)">
    <ellipse cx="0" cy="16" rx="22" ry="28" fill="#e05050" opacity="0.9"/>
    <ellipse cx="0" cy="8" rx="14" ry="10" fill="#B8892A" opacity="0.7"/>
    <line x1="-13" y1="40" x2="-20" y2="60" stroke="#5a3a00" stroke-width="1.4"/>
    <line x1="0" y1="44" x2="0" y2="65" stroke="#5a3a00" stroke-width="1.4"/>
    <line x1="13" y1="40" x2="20" y2="60" stroke="#5a3a00" stroke-width="1.4"/>
    <line x1="0" y1="-14" x2="0" y2="-45" stroke="#2d7a3a" stroke-width="2.5"/>
    <text x="0" y="-50" text-anchor="middle" font-size="14">🌷</text>
  </g>
  <text x="500" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Tulpe</text>
  <text x="500" y="300" text-anchor="middle" font-size="10" fill="#f0d090">12–15 cm tief</text>
  <text x="500" y="313" text-anchor="middle" font-size="9" fill="#d4b870">Blüte: April–Mai</text>

  <!-- Spitze-nach-oben Hinweis -->
  <rect x="220" y="290" width="160" height="24" rx="8" fill="#1C4A2E"/>
  <text x="300" y="306" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">↑ Spitze immer nach oben!</text>
</svg>
