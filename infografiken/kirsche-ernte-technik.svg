<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="310" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Kirschen richtig ernten — so bleiben sie länger frisch</text>

  <!-- Richtig: Mit Stiel -->
  <g transform="translate(110,48)">
    <rect x="-88" y="0" width="176" height="215" rx="9" fill="#1C4A2E" opacity="0.07"/>
    <text x="0" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#1C4A2E">✓ Mit Stiel pflücken</text>
    <!-- Kirschpaar mit langem Stiel -->
    <line x1="-10" y1="42" x2="10" y2="42" stroke="#2d7a3a" stroke-width="2.5"/>
    <line x1="0" y1="42" x2="0" y2="28" stroke="#2d7a3a" stroke-width="2.5"/>
    <circle cx="-18" cy="72" r="22" fill="#7A2430"/>
    <line x1="-18" y1="50" x2="-12" y2="42" stroke="#2d7a3a" stroke-width="2.5"/>
    <circle cx="18" cy="75" r="22" fill="#7A2430"/>
    <line x1="18" y1="53" x2="12" y2="42" stroke="#2d7a3a" stroke-width="2.5"/>
    <!-- Schere schneidet den Stiel -->
    <text x="58" y="55" font-size="18" text-anchor="middle">✂️</text>
    <text x="0" y="116" text-anchor="middle" font-size="10" fill="#1C4A2E">Stiel bleibt dran</text>
    <text x="0" y="130" text-anchor="middle" font-size="10" fill="#1C4A2E">→ hält 3× länger</text>
    <text x="0" y="150" text-anchor="middle" font-size="9" fill="#555">Stielansatz bleibt</text>
    <text x="0" y="163" text-anchor="middle" font-size="9" fill="#555">verschlossen — keine</text>
    <text x="0" y="176" text-anchor="middle" font-size="9" fill="#555">Feuchtigkeit tritt aus</text>
    <rect x="-60" y="188" width="120" height="18" rx="6" fill="#1C4A2E"/>
    <text x="0" y="201" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Haltbarkeit: 4–5 Tage</text>
  </g>

  <!-- Falsch: Ohne Stiel -->
  <g transform="translate(300,48)">
    <rect x="-88" y="0" width="176" height="215" rx="9" fill="#7A2430" opacity="0.07"/>
    <text x="0" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2430">✗ Ohne Stiel abreißen</text>
    <!-- Kirsche ohne Stiel, offene Wunde -->
    <circle cx="0" cy="72" r="26" fill="#7A2430" opacity="0.7"/>
    <circle cx="0" cy="50" r="5" fill="#c0522a" opacity="0.8"/>
    <line x1="-3" y1="50" x2="3" y2="50" stroke="#F6F1E9" stroke-width="1.5"/>
    <text x="0" y="116" text-anchor="middle" font-size="10" fill="#7A2430">Offene Einrissstelle</text>
    <text x="0" y="130" text-anchor="middle" font-size="10" fill="#7A2430">→ fault sofort</text>
    <text x="0" y="150" text-anchor="middle" font-size="9" fill="#555">Saft tritt aus,</text>
    <text x="0" y="163" text-anchor="middle" font-size="9" fill="#555">Pilze siedeln sich an,</text>
    <text x="0" y="176" text-anchor="middle" font-size="9" fill="#555">Schimmel nach 1 Tag</text>
    <rect x="-60" y="188" width="120" height="18" rx="6" fill="#7A2430"/>
    <text x="0" y="201" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Haltbarkeit: 1–2 Tage</text>
  </g>

  <!-- Timing & Wetter rechts -->
  <g transform="translate(490,48)">
    <rect x="-80" y="0" width="160" height="215" rx="9" fill="#B8892A" opacity="0.08"/>
    <text x="0" y="18" text-anchor="middle" font-size="12" font-weight="700" fill="#1C4A2E">Timing</text>
    <text x="0" y="42" text-anchor="middle" font-size="22">🌅</text>
    <text x="0" y="60" text-anchor="middle" font-size="10" font-weight="600" fill="#1C4A2E">Morgens ernten</text>
    <text x="0" y="75" text-anchor="middle" font-size="9" fill="#555">Früchte noch kühl,</text>
    <text x="0" y="88" text-anchor="middle" font-size="9" fill="#555">fest und prall</text>
    <line x1="-50" y1="100" x2="50" y2="100" stroke="#ddd" stroke-width="1"/>
    <text x="0" y="116" text-anchor="middle" font-size="22">☁️</text>
    <text x="0" y="134" text-anchor="middle" font-size="10" font-weight="600" fill="#1C4A2E">Nicht nach Regen</text>
    <text x="0" y="149" text-anchor="middle" font-size="9" fill="#555">Nasse Früchte platzen</text>
    <text x="0" y="162" text-anchor="middle" font-size="9" fill="#555">beim Pflücken leichter</text>
    <line x1="-50" y1="173" x2="50" y2="173" stroke="#ddd" stroke-width="1"/>
    <text x="0" y="188" text-anchor="middle" font-size="9" fill="#555">Ungewaschen lagern</text>
    <text x="0" y="201" text-anchor="middle" font-size="9" fill="#555">→ erst vor dem Essen</text>
  </g>

  <!-- Trennlinien -->
  <line x1="212" y1="44" x2="212" y2="270" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="410" y1="44" x2="410" y2="270" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="30" y="272" width="540" height="28" rx="8" fill="#1C4A2E" opacity="0.08"/>
  <text x="300" y="290" text-anchor="middle" font-size="11" fill="#1C4A2E" font-weight="600">Kirschmaschine / Entsteiner: erst unmittelbar vor dem Verarbeiten nutzen — nicht vorher entstielen</text>
</svg>
