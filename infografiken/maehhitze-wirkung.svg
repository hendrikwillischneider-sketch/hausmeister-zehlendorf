<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="310" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Warum wir im Sommer höher mähen — und seltener</text>

  <!-- LINKS: Falsch – kurz geschnitten bei Hitze -->
  <text x="150" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2430">✗ Zu kurz bei Hitze</text>

  <!-- Sonne -->
  <circle cx="100" cy="78" r="18" fill="#F4C430" opacity="0.9"/>
  <g stroke="#F4C430" stroke-width="2" opacity="0.8">
    <line x1="100" y1="54" x2="100" y2="46"/>
    <line x1="100" y1="102" x2="100" y2="110"/>
    <line x1="76" y1="78" x2="68" y2="78"/>
    <line x1="124" y1="78" x2="132" y2="78"/>
    <line x1="84" y1="62" x2="78" y2="56"/>
    <line x1="116" y1="94" x2="122" y2="100"/>
    <line x1="116" y1="62" x2="122" y2="56"/>
    <line x1="84" y1="94" x2="78" y2="100"/>
  </g>
  <text x="100" y="78" text-anchor="middle" font-size="10" fill="#8B6914" font-weight="700">35°</text>

  <!-- Kurzes Gras, Boden in der Sonne -->
  <rect x="30" y="210" width="240" height="60" fill="#8B6914"/>
  <rect x="30" y="202" width="240" height="10" fill="#4a7c2f"/>
  <g stroke="#4a7c2f" stroke-width="1.5" stroke-linecap="round">
    <line x1="50"  y1="202" x2="49"  y2="192"/>
    <line x1="75"  y1="202" x2="76"  y2="190"/>
    <line x1="100" y1="202" x2="99"  y2="191"/>
    <line x1="125" y1="202" x2="126" y2="189"/>
    <line x1="150" y1="202" x2="149" y2="192"/>
    <line x1="175" y1="202" x2="176" y2="190"/>
    <line x1="200" y1="202" x2="199" y2="191"/>
    <line x1="225" y1="202" x2="226" y2="189"/>
    <line x1="250" y1="202" x2="249" y2="192"/>
  </g>
  <!-- Hitze-Strahlen auf Boden -->
  <g stroke="#F4C430" stroke-width="1.5" opacity="0.6" stroke-dasharray="3,2">
    <line x1="80"  y1="135" x2="80"  y2="202"/>
    <line x1="130" y1="120" x2="130" y2="202"/>
    <line x1="180" y1="130" x2="180" y2="202"/>
    <line x1="230" y1="125" x2="230" y2="202"/>
  </g>
  <text x="150" y="232" text-anchor="middle" font-size="10" fill="#fff" font-weight="600">Boden direkt in der Sonne</text>
  <text x="150" y="248" text-anchor="middle" font-size="9" fill="#f0d090">Verdunstung extrem hoch</text>
  <text x="150" y="262" text-anchor="middle" font-size="9" fill="#f0d090">Wurzeln verbrennen/vertrocknen</text>
  <!-- Braune Flecken -->
  <ellipse cx="80" cy="200" rx="18" ry="5" fill="#8B6914" opacity="0.8"/>
  <ellipse cx="170" cy="199" rx="14" ry="4" fill="#8B6914" opacity="0.7"/>
  <text x="150" y="283" text-anchor="middle" font-size="9" fill="#7A2430" font-weight="600">Braune Flecken entstehen</text>

  <!-- RECHTS: Richtig – höher gelassen -->
  <text x="450" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#1C4A2E">✓ Höher = Naturklimaanlage</text>

  <circle cx="490" cy="78" r="18" fill="#F4C430" opacity="0.7"/>
  <g stroke="#F4C430" stroke-width="2" opacity="0.5">
    <line x1="490" y1="54" x2="490" y2="46"/>
    <line x1="490" y1="102" x2="490" y2="110"/>
    <line x1="466" y1="78" x2="458" y2="78"/>
    <line x1="514" y1="78" x2="522" y2="78"/>
  </g>

  <rect x="330" y="210" width="240" height="60" fill="#5a3a10"/>
  <rect x="330" y="172" width="240" height="40" fill="#3a7a2a" opacity="0.8"/>
  <rect x="330" y="162" width="240" height="12" fill="#3a9a4a"/>
  <g stroke="#2d7a3a" stroke-width="2.5" stroke-linecap="round">
    <line x1="350" y1="162" x2="347" y2="128"/>
    <line x1="375" y1="162" x2="378" y2="125"/>
    <line x1="400" y1="162" x2="397" y2="130"/>
    <line x1="425" y1="162" x2="428" y2="126"/>
    <line x1="450" y1="162" x2="447" y2="129"/>
    <line x1="475" y1="162" x2="478" y2="125"/>
    <line x1="500" y1="162" x2="497" y2="130"/>
    <line x1="525" y1="162" x2="528" y2="126"/>
    <line x1="550" y1="162" x2="547" y2="128"/>
  </g>
  <!-- Schattenzone -->
  <rect x="330" y="190" width="240" height="22" fill="#1C4A2E" opacity="0.15"/>
  <text x="450" y="204" text-anchor="middle" font-size="8" fill="#fff" opacity="0.8">Schatten kühlt Boden</text>
  <!-- Hitzestrahlen abgeschirmt -->
  <g stroke="#F4C430" stroke-width="1.5" opacity="0.3" stroke-dasharray="3,2">
    <line x1="380" y1="120" x2="380" y2="162"/>
    <line x1="430" y1="115" x2="430" y2="162"/>
    <line x1="480" y1="120" x2="480" y2="162"/>
    <line x1="530" y1="115" x2="530" y2="162"/>
  </g>
  <text x="450" y="232" text-anchor="middle" font-size="10" fill="#d4e8d0" font-weight="600">Boden bleibt kühl &amp; feucht</text>
  <text x="450" y="248" text-anchor="middle" font-size="9" fill="#b8d4b0">Tiefe Wurzeln überleben</text>
  <text x="450" y="262" text-anchor="middle" font-size="9" fill="#b8d4b0">50% weniger Bewässerung nötig</text>
  <text x="450" y="283" text-anchor="middle" font-size="9" fill="#3a9a4a" font-weight="600">Satteres Grün ohne Mehraufwand</text>

  <line x1="300" y1="42" x2="300" y2="295" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="30" y="295" width="540" height="10" rx="4" fill="#1C4A2E" opacity="0.08"/>
  <text x="300" y="303" text-anchor="middle" font-size="9" fill="#1C4A2E">Sommer-Schnitthöhe: 5–6 cm · Normal: 4 cm · Bei Hitze über 25 °C: Mähpause einlegen</text>
</svg>
