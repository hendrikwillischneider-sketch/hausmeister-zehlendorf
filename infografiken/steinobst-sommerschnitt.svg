<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Steinobst im Sommer schneiden — nicht im Winter</text>

  <!-- LINKS: Sommerschnitt = GUT -->
  <text x="145" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#1C4A2E">✓ Sommerschnitt (Jun–Aug)</text>

  <!-- Baum Silhouette gesund -->
  <ellipse cx="145" cy="140" rx="75" ry="70" fill="#3a9a4a" opacity="0.5"/>
  <ellipse cx="115" cy="115" rx="35" ry="30" fill="#3a9a4a" opacity="0.4"/>
  <ellipse cx="175" cy="110" rx="30" ry="28" fill="#3a9a4a" opacity="0.4"/>
  <rect x="138" y="205" width="14" height="40" fill="#6B4423"/>
  <!-- Schnittmarkierung -->
  <line x1="80" y1="120" x2="60" y2="110" stroke="#1C4A2E" stroke-width="1.5"/>
  <text x="58" y="107" text-anchor="end" font-size="20">✂️</text>
  <!-- Wundmarkierung -->
  <circle cx="85" cy="122" r="5" fill="#F4C430" stroke="#8B6914" stroke-width="1"/>

  <!-- Sonne -->
  <circle cx="200" cy="72" r="14" fill="#F4C430" opacity="0.8"/>
  <g stroke="#F4C430" stroke-width="1.5" opacity="0.7">
    <line x1="200" y1="53" x2="200" y2="46"/>
    <line x1="200" y1="91" x2="200" y2="98"/>
    <line x1="181" y1="72" x2="174" y2="72"/>
    <line x1="219" y1="72" x2="226" y2="72"/>
  </g>

  <!-- Wunde trocknet = gut -->
  <rect x="30" y="252" width="230" height="52" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="145" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Wärme schützt die Schnittwunde:</text>
  <text x="145" y="283" text-anchor="middle" font-size="9" fill="#555">✓ Wunde trocknet schnell aus</text>
  <text x="145" y="297" text-anchor="middle" font-size="9" fill="#555">✓ Pilze/Viren finden keinen Eingang</text>
  <text x="145" y="311" text-anchor="middle" font-size="9" fill="#555">✓ Baum heilt vor dem Winter</text>

  <!-- TRENNLINIE -->
  <line x1="300" y1="42" x2="300" y2="310" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- RECHTS: Winterschnitt = SCHLECHT -->
  <text x="455" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2430">✗ Winterschnitt (Nov–Feb)</text>

  <!-- Baum Silhouette krank -->
  <ellipse cx="455" cy="140" rx="75" ry="70" fill="#5a7a3a" opacity="0.35"/>
  <ellipse cx="420" cy="115" rx="30" ry="26" fill="#8B6914" opacity="0.4"/>
  <ellipse cx="485" cy="110" rx="28" ry="25" fill="#7A2430" opacity="0.3"/>
  <rect x="448" y="205" width="14" height="40" fill="#6B4423"/>
  <!-- Schnittsymbol -->
  <text x="380" y="107" font-size="20">✂️</text>
  <!-- Wunde offen, Regen -->
  <circle cx="395" cy="122" r="5" fill="#c0522a" stroke="#7A2430" stroke-width="1"/>
  <!-- Regentropfen -->
  <text x="408" y="88" font-size="11" fill="#4a90d9">💧💧</text>

  <!-- Scharka-Virus Callout -->
  <rect x="390" y="155" width="155" height="55" rx="7" fill="#7A2430" opacity="0.1"/>
  <text x="467" y="170" text-anchor="middle" font-size="10" font-weight="700" fill="#7A2430">⚠ Scharka-Virus</text>
  <text x="467" y="184" text-anchor="middle" font-size="9" fill="#7A2430">Tritt durch offene Wunden ein</text>
  <text x="467" y="197" text-anchor="middle" font-size="9" fill="#555">Keine Heilung möglich</text>

  <rect x="320" y="252" width="250" height="52" rx="7" fill="#7A2430" opacity="0.07"/>
  <text x="445" y="268" text-anchor="middle" font-size="10" font-weight="700" fill="#7A2430">Kälte und Nässe öffnen Tore:</text>
  <text x="445" y="283" text-anchor="middle" font-size="9" fill="#555">✗ Wunde bleibt wochenlang feucht</text>
  <text x="445" y="297" text-anchor="middle" font-size="9" fill="#555">✗ Scharka-Virus &amp; Monilia gelangen rein</text>
  <text x="445" y="311" text-anchor="middle" font-size="9" fill="#7A2430">✗ Baum stirbt langsam ab — keine Heilung</text>

  <!-- Virus-Symbol Mitte -->
  <text x="300" y="140" text-anchor="middle" font-size="32">🍒</text>
  <text x="300" y="163" text-anchor="middle" font-size="9" fill="#8B6914" font-weight="600">Kirsche · Pflaume</text>
  <text x="300" y="176" text-anchor="middle" font-size="9" fill="#8B6914">Mirabelle · Zwetschge</text>
</svg>
