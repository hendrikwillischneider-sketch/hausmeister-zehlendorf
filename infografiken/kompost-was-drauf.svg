<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>
  <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1C4A2E">Was auf den Kompost darf — und was nicht</text>

  <!-- Links: Darf drauf -->
  <text x="148" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">✓ Willkommen</text>

  <g transform="translate(16, 54)">
    <rect x="0" y="0" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.14"/>
    <text x="132" y="15" text-anchor="middle" font-size="9" fill="#1C4A2E">🍂 Laub (nicht zu viel auf einmal)</text>

    <rect x="0" y="26" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.12"/>
    <text x="132" y="41" text-anchor="middle" font-size="9" fill="#1C4A2E">🌿 Rasenschnitt, Grünschnitt</text>

    <rect x="0" y="52" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.11"/>
    <text x="132" y="67" text-anchor="middle" font-size="9" fill="#1C4A2E">🍎 Fallobst, Gemüsereste (roh)</text>

    <rect x="0" y="78" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.10"/>
    <text x="132" y="93" text-anchor="middle" font-size="9" fill="#1C4A2E">☕ Kaffeesatz, Teebeutel (Papier ok)</text>

    <rect x="0" y="104" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.09"/>
    <text x="132" y="119" text-anchor="middle" font-size="9" fill="#1C4A2E">🥕 Schalen, Eierschalen</text>

    <rect x="0" y="130" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.08"/>
    <text x="132" y="145" text-anchor="middle" font-size="9" fill="#1C4A2E">🪵 Häckselgut, Stroh, Pappe (geschreddert)</text>

    <rect x="0" y="156" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.08"/>
    <text x="132" y="171" text-anchor="middle" font-size="9" fill="#1C4A2E">🌸 Verblühte Stauden, Unkraut (ohne Samen)</text>

    <rect x="0" y="182" width="264" height="22" rx="5" fill="#3a9a4a" opacity="0.07"/>
    <text x="132" y="197" text-anchor="middle" font-size="9" fill="#1C4A2E">🐀 Haare, Federn (stickstoffreich)</text>
  </g>

  <!-- Trennlinie -->
  <line x1="300" y1="40" x2="300" y2="276" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Rechts: Nicht drauf -->
  <text x="450" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#7A2430">✗ Nicht auf den Kompost</text>

  <g transform="translate(310, 54)">
    <rect x="0" y="0" width="274" height="22" rx="5" fill="#7A2430" opacity="0.10"/>
    <text x="137" y="15" text-anchor="middle" font-size="9" fill="#7A2430">🍖 Fleisch, Fisch, gekochte Reste</text>

    <rect x="0" y="26" width="274" height="22" rx="5" fill="#7A2430" opacity="0.09"/>
    <text x="137" y="41" text-anchor="middle" font-size="9" fill="#7A2430">🧀 Milchprodukte, Fette, Öle</text>

    <rect x="0" y="52" width="274" height="22" rx="5" fill="#7A2430" opacity="0.09"/>
    <text x="137" y="67" text-anchor="middle" font-size="9" fill="#7A2430">🤒 Kranke Pflanzen (Pilze, Viren)</text>

    <rect x="0" y="78" width="274" height="22" rx="5" fill="#7A2430" opacity="0.08"/>
    <text x="137" y="93" text-anchor="middle" font-size="9" fill="#7A2430">🌰 Walnuss- und Eichenlaub (Menge)</text>

    <rect x="0" y="104" width="274" height="22" rx="5" fill="#7A2430" opacity="0.08"/>
    <text x="137" y="119" text-anchor="middle" font-size="9" fill="#7A2430">🐱 Katzenstreu, Hundekotvon</text>

    <rect x="0" y="130" width="274" height="22" rx="5" fill="#7A2430" opacity="0.07"/>
    <text x="137" y="145" text-anchor="middle" font-size="9" fill="#7A2430">🧴 Behandelte Pflanzen (Pestizide)</text>

    <rect x="0" y="156" width="274" height="22" rx="5" fill="#7A2430" opacity="0.07"/>
    <text x="137" y="171" text-anchor="middle" font-size="9" fill="#7A2430">🔥 Asche aus Kohle/behandeltem Holz</text>

    <rect x="0" y="182" width="274" height="22" rx="5" fill="#B8892A" opacity="0.10"/>
    <text x="137" y="197" text-anchor="middle" font-size="9" fill="#8B6914">⚠ Büchszünsler-Triebe → Mülltonne!</text>
  </g>

  <rect x="16" y="265" width="568" height="28" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="280" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Faustregel: Alles was aus dem Garten kommt und nicht krank ist — darf in den Kompost</text>
</svg>
