<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>
  <text x="300" y="22" text-anchor="middle" font-size="14" font-weight="700" fill="#1C4A2E">Was ins Futterhaus kommt — und was nicht</text>

  <!-- Links: Gutes Futter -->
  <text x="145" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">✓ Geeignetes Futter</text>

  <g transform="translate(12,52)">
    <rect x="0" y="0"   width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.12"/>
    <text x="134" y="18" text-anchor="middle" font-size="9" fill="#1C4A2E">🌻 Sonnenblumenkerne — Energiereich für alle</text>

    <rect x="0" y="32"  width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.11"/>
    <text x="134" y="50" text-anchor="middle" font-size="9" fill="#1C4A2E">🟤 Meisenknödel — Fett + Körner für Meisen &amp; Spechte</text>

    <rect x="0" y="64"  width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.10"/>
    <text x="134" y="82" text-anchor="middle" font-size="9" fill="#1C4A2E">🫘 Erdnüsse (ungesalzen, im Netz) — Für Meisen &amp; Kleiber</text>

    <rect x="0" y="96"  width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.09"/>
    <text x="134" y="114" text-anchor="middle" font-size="9" fill="#1C4A2E">🌾 Haferflocken (trocken) — Weichfresser wie Rotkehlchen</text>

    <rect x="0" y="128" width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.08"/>
    <text x="134" y="146" text-anchor="middle" font-size="9" fill="#1C4A2E">🍎 Äpfel / Birnen (halbiert) — Amseln &amp; Drosseln</text>

    <rect x="0" y="160" width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.07"/>
    <text x="134" y="178" text-anchor="middle" font-size="9" fill="#1C4A2E">🫐 Getrocknete Beeren — Energiereiche Winterkost</text>

    <rect x="0" y="192" width="268" height="28" rx="6" fill="#3a9a4a" opacity="0.06"/>
    <text x="134" y="210" text-anchor="middle" font-size="9" fill="#1C4A2E">🐛 Mehlwürmer (getrocknet) — Hoch bei Rotkehlchen</text>
  </g>

  <!-- Trennline -->
  <line x1="298" y1="38" x2="298" y2="268" stroke="#ddd" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Rechts: Nicht geeignet -->
  <text x="450" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#7A2430">✗ Nicht füttern</text>

  <g transform="translate(308,52)">
    <rect x="0" y="0"   width="278" height="28" rx="6" fill="#7A2430" opacity="0.10"/>
    <text x="139" y="18" text-anchor="middle" font-size="9" fill="#7A2430">🍞 Brot (auch Toastbrot) — Aufquellung im Magen!</text>

    <rect x="0" y="32"  width="278" height="28" rx="6" fill="#7A2430" opacity="0.09"/>
    <text x="139" y="50" text-anchor="middle" font-size="9" fill="#7A2430">🧂 Gesalzenes, Gewürztes — Nierenschäden bei Vögeln</text>

    <rect x="0" y="64"  width="278" height="28" rx="6" fill="#7A2430" opacity="0.09"/>
    <text x="139" y="82" text-anchor="middle" font-size="9" fill="#7A2430">🥛 Milch / Käse — Vögel sind laktoseintolerant</text>

    <rect x="0" y="96"  width="278" height="28" rx="6" fill="#7A2430" opacity="0.08"/>
    <text x="139" y="114" text-anchor="middle" font-size="9" fill="#7A2430">🍟 Frittiertes, Chips — Fett + Salz — doppelt schädlich</text>

    <rect x="0" y="128" width="278" height="28" rx="6" fill="#7A2430" opacity="0.08"/>
    <text x="139" y="146" text-anchor="middle" font-size="9" fill="#7A2430">🥦 Zwiebeln / Knoblauch — giftig für Vögel</text>

    <rect x="0" y="160" width="278" height="28" rx="6" fill="#B8892A" opacity="0.10"/>
    <text x="139" y="178" text-anchor="middle" font-size="9" fill="#8B6914">⚠ Erdnussbutter — Kann Schnabel verkleben</text>

    <rect x="0" y="192" width="278" height="28" rx="6" fill="#B8892A" opacity="0.09"/>
    <text x="139" y="210" text-anchor="middle" font-size="9" fill="#8B6914">⚠ Alte/feuchte Körner — Schimmel ist tödlich</text>
  </g>

  <rect x="12" y="270" width="576" height="24" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="286" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Futterhaus täglich prüfen: Feuchtigkeit entfernen, nasses Futter sofort tauschen — Schimmel ist gefährlich</text>
</svg>
