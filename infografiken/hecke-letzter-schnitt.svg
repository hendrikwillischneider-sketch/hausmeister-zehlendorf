<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Letzter Heckenschnitt im September — dann Winterpause</text>

  <!-- Jahreskalender als Streifen -->
  <text x="300" y="50" text-anchor="middle" font-size="11" font-weight="600" fill="#555">Wann darf geschnitten werden?</text>

  <!-- Monate Streifen -->
  <g transform="translate(20, 58)">
    <!-- Jan-Feb: erlaubt (grün) -->
    <rect x="0"   y="0" width="82" height="28" rx="4" fill="#3a9a4a" opacity="0.7"/>
    <text x="41"  y="18" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">Jan · Feb ✓</text>
    <!-- März-Sep: gesperrt (rot) -->
    <rect x="85"  y="0" width="295" height="28" rx="4" fill="#7A2430" opacity="0.75"/>
    <text x="232" y="14" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">März – September</text>
    <text x="232" y="26" text-anchor="middle" font-size="8" fill="#ffc0c0">Kein starker Rückschnitt (§39 BNatSchG)</text>
    <!-- Okt-Dez: erlaubt (grün) -->
    <rect x="383" y="0" width="157" height="28" rx="4" fill="#3a9a4a" opacity="0.7"/>
    <text x="461" y="18" text-anchor="middle" font-size="9" fill="#fff" font-weight="600">Okt · Nov · Dez ✓</text>
  </g>

  <!-- Pfeil: "Wir sind HIER — letzter Schnitt!" -->
  <text x="300" y="106" text-anchor="middle" font-size="10" fill="#B8892A" font-weight="700">↑ September = letzter Formschnitt vor dem Winter</text>

  <!-- Hecke VORHER / NACHHER -->
  <text x="145" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#7A2430">Vor dem Schnitt</text>
  <text x="455" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Nach dem Schnitt</text>

  <!-- Hecke wild gewachsen - links -->
  <!-- Boden -->
  <rect x="30" y="232" width="240" height="20" fill="#8B6914" opacity="0.4"/>
  <!-- Heckenblöcke unregelmäßig -->
  <rect x="35"  y="148" width="38" height="86" rx="3" fill="#3a9a4a" opacity="0.7"/>
  <rect x="70"  y="138" width="42" height="96" rx="3" fill="#2d7a3a" opacity="0.8"/>
  <rect x="109" y="143" width="40" height="91" rx="3" fill="#3a9a4a" opacity="0.7"/>
  <rect x="146" y="135" width="45" height="99" rx="3" fill="#2d7a3a" opacity="0.8"/>
  <rect x="187" y="140" width="38" height="94" rx="3" fill="#3a9a4a" opacity="0.7"/>
  <rect x="222" y="147" width="40" height="87" rx="3" fill="#2d7a3a" opacity="0.75"/>
  <!-- Wilde Triebe heraus -->
  <line x1="80"  y1="138" x2="75"  y2="118" stroke="#4a8a35" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="120" y1="135" x2="132" y2="112" stroke="#4a8a35" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="165" y1="132" x2="155" y2="108" stroke="#4a8a35" stroke-width="3" stroke-linecap="round"/>
  <line x1="200" y1="137" x2="212" y2="115" stroke="#4a8a35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Schnittlinie geplant -->
  <line x1="30" y1="148" x2="270" y2="148" stroke="#7A2430" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- TRENNLINIE -->
  <line x1="300" y1="120" x2="300" y2="258" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Hecke geschnitten - rechts -->
  <rect x="330" y="232" width="240" height="20" fill="#8B6914" opacity="0.4"/>
  <!-- Heckenblöcke gerade, Trapezform -->
  <polygon points="335,148 555,148 545,232 345,232" fill="#2d7a3a" opacity="0.75"/>
  <polygon points="345,150 545,150 540,178 350,178" fill="#3a9a4a" opacity="0.4"/>
  <!-- Gerade Oberlinie -->
  <line x1="335" y1="148" x2="555" y2="148" stroke="#1C4A2E" stroke-width="2.5"/>
  <!-- Trapez-Seitenlinien -->
  <line x1="335" y1="148" x2="345" y2="232" stroke="#1C4A2E" stroke-width="1.5"/>
  <line x1="555" y1="148" x2="545" y2="232" stroke="#1C4A2E" stroke-width="1.5"/>
  <!-- Winkelmaß -->
  <text x="378" y="175" font-size="9" fill="#fff" opacity="0.9">leicht schräge</text>
  <text x="378" y="187" font-size="9" fill="#fff" opacity="0.9">Seiten = mehr Licht</text>

  <!-- Hinweis warum letzter Schnitt -->
  <rect x="30" y="258" width="540" height="54" rx="8" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="274" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Warum September der letzte richtige Schnitt-Termin ist:</text>
  <text x="300" y="290" text-anchor="middle" font-size="9" fill="#555">Neuwuchs nach dem Schnitt hätte keine Zeit mehr zum Verholzen — Frost würde ihn abtöten</text>
  <text x="300" y="304" text-anchor="middle" font-size="9" fill="#555">Vögel haben ihre Bruten beendet · Ergebnis bleibt bis Frühjahr sauber und kompakt</text>
  <text x="300" y="318" text-anchor="middle" font-size="9" fill="#B8892A" font-weight="600">Für Bewohnerinnen: Die Hecken werden jetzt für den Winter »fertiggemacht«</text>
</svg>
