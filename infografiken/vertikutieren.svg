<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="310" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Vertikutieren: Was passiert im Boden?</text>

  <!-- VORHER -->
  <text x="140" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#7A2430">Vorher: Rasenfilz blockiert</text>

  <!-- Boden-Schichten vorher -->
  <rect x="30" y="55" width="240" height="25" fill="#4a7c2f"/>   <!-- Gras -->
  <rect x="30" y="80" width="240" height="18" fill="#6B3D11"/>    <!-- Filzschicht -->
  <rect x="30" y="98" width="240" height="90" fill="#8B6914"/>    <!-- Erde -->

  <!-- Filz-Label -->
  <rect x="180" y="81" width="85" height="16" rx="4" fill="#7A2430"/>
  <text x="222" y="93" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">Rasenfilz</text>

  <!-- Grashalme vorher (dünn, krank) -->
  <g stroke="#7aaa7a" stroke-width="1.5" stroke-linecap="round">
    <line x1="50" y1="55" x2="48" y2="30"/>
    <line x1="68" y1="55" x2="70" y2="28"/>
    <line x1="86" y1="55" x2="84" y2="32"/>
    <line x1="104" y1="55" x2="106" y2="27"/>
    <line x1="122" y1="55" x2="120" y2="31"/>
    <line x1="140" y1="55" x2="142" y2="29"/>
    <line x1="158" y1="55" x2="156" y2="33"/>
    <line x1="176" y1="55" x2="178" y2="28"/>
    <line x1="194" y1="55" x2="192" y2="30"/>
    <line x1="212" y1="55" x2="214" y2="27"/>
    <line x1="230" y1="55" x2="228" y2="31"/>
    <line x1="248" y1="55" x2="250" y2="29"/>
  </g>

  <!-- Wasser/Luft blockiert -->
  <g opacity="0.7">
    <text x="55" y="75" font-size="11" fill="#4a90d9">💧</text>
    <text x="90" y="75" font-size="11" fill="#4a90d9">💧</text>
    <text x="125" y="75" font-size="11" fill="#888">〇</text>
    <!-- Blockier-Symbol -->
    <line x1="55" y1="79" x2="55" y2="82" stroke="#7A2430" stroke-width="2"/>
    <line x1="90" y1="79" x2="90" y2="82" stroke="#7A2430" stroke-width="2"/>
  </g>
  <text x="140" y="143" text-anchor="middle" font-size="10" fill="#c0c0a0">Wasser staut sich oben</text>
  <text x="140" y="157" text-anchor="middle" font-size="10" fill="#c0c0a0">Wurzeln verkümmern</text>

  <!-- flache schwache Wurzeln -->
  <g stroke="#7a5c1e" stroke-width="1" opacity="0.5">
    <line x1="70" y1="98" x2="65" y2="115"/>
    <line x1="120" y1="98" x2="115" y2="112"/>
    <line x1="170" y1="98" x2="165" y2="113"/>
    <line x1="220" y1="98" x2="215" y2="114"/>
  </g>

  <!-- NACHHER -->
  <text x="450" y="50" text-anchor="middle" font-size="12" font-weight="700" fill="#1C4A2E">Nachher: Boden kann atmen</text>

  <!-- Boden-Schichten nachher -->
  <rect x="330" y="55" width="240" height="25" fill="#3a9a4a"/>
  <rect x="330" y="98" width="240" height="90" fill="#8B6914"/>
  <!-- Kein Filz mehr, aufgelockert -->
  <rect x="330" y="80" width="240" height="18" fill="#7a5c2e" opacity="0.4"/>
  <text x="450" y="93" text-anchor="middle" font-size="9" fill="#d4b870">aufgelockert</text>

  <!-- Schlitze / Löcher vom Vertikutieren -->
  <g fill="#5a3a00" opacity="0.6">
    <rect x="355" y="75" width="3" height="35"/>
    <rect x="378" y="75" width="3" height="40"/>
    <rect x="401" y="75" width="3" height="33"/>
    <rect x="424" y="75" width="3" height="38"/>
    <rect x="447" y="75" width="3" height="35"/>
    <rect x="470" y="75" width="3" height="40"/>
    <rect x="493" y="75" width="3" height="33"/>
    <rect x="516" y="75" width="3" height="37"/>
    <rect x="539" y="75" width="3" height="35"/>
  </g>

  <!-- Grashalme nachher (kräftig) -->
  <g stroke="#1a7a2a" stroke-width="2.5" stroke-linecap="round">
    <line x1="350" y1="55" x2="347" y2="22"/>
    <line x1="370" y1="55" x2="373" y2="18"/>
    <line x1="390" y1="55" x2="387" y2="20"/>
    <line x1="410" y1="55" x2="413" y2="16"/>
    <line x1="430" y1="55" x2="427" y2="19"/>
    <line x1="450" y1="55" x2="453" y2="15"/>
    <line x1="470" y1="55" x2="467" y2="20"/>
    <line x1="490" y1="55" x2="493" y2="17"/>
    <line x1="510" y1="55" x2="507" y2="19"/>
    <line x1="530" y1="55" x2="533" y2="16"/>
    <line x1="550" y1="55" x2="547" y2="20"/>
  </g>

  <!-- Wasser und Luft fließen durch -->
  <text x="358" y="74" font-size="10" fill="#4a90d9">💧</text>
  <text x="402" y="74" font-size="10" fill="#4a90d9">💧</text>
  <text x="446" y="74" font-size="10" fill="#888">○</text>
  <text x="490" y="74" font-size="10" fill="#4a90d9">💧</text>

  <!-- tiefe Wurzeln -->
  <g stroke="#3a6010" stroke-width="1.5" opacity="0.8">
    <line x1="370" y1="98" x2="360" y2="150"/>
    <line x1="370" y1="98" x2="380" y2="155"/>
    <line x1="420" y1="98" x2="410" y2="152"/>
    <line x1="420" y1="98" x2="430" y2="158"/>
    <line x1="470" y1="98" x2="460" y2="150"/>
    <line x1="470" y1="98" x2="480" y2="155"/>
    <line x1="520" y1="98" x2="510" y2="148"/>
    <line x1="520" y1="98" x2="530" y2="153"/>
  </g>
  <text x="450" y="160" text-anchor="middle" font-size="10" fill="#3a6010" font-weight="600">Tiefe, starke Wurzeln</text>
  <text x="450" y="174" text-anchor="middle" font-size="10" fill="#3a6010">Wasser, Luft und Nährstoffe fließen durch</text>

  <!-- Vertikutierer-Symbol -->
  <g transform="translate(440,220)">
    <rect x="-40" y="-10" width="80" height="30" rx="4" fill="#555"/>
    <text x="0" y="11" text-anchor="middle" font-size="11" fill="#fff">Vertikutierer</text>
    <!-- Messer -->
    <g fill="#B8892A">
      <rect x="-30" y="18" width="4" height="14" rx="1"/>
      <rect x="-18" y="18" width="4" height="14" rx="1"/>
      <rect x="-6" y="18" width="4" height="14" rx="1"/>
      <rect x="6" y="18" width="4" height="14" rx="1"/>
      <rect x="18" y="18" width="4" height="14" rx="1"/>
      <rect x="30" y="18" width="4" height="14" rx="1"/>
    </g>
  </g>
  <text x="440" y="262" text-anchor="middle" font-size="10" fill="#555">Rotierende Messer schneiden Filz auf</text>

  <!-- Trennlinie -->
  <line x1="300" y1="42" x2="300" y2="290" stroke="#ccc" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Timing-Hinweis -->
  <rect x="30" y="275" width="540" height="28" rx="8" fill="#1C4A2E" opacity="0.1"/>
  <text x="300" y="287" text-anchor="middle" font-size="11" fill="#1C4A2E" font-weight="600">Wann: April/Mai · Bodentemperatur mind. 8 °C · Danach: Nachsäen + Düngen</text>
  <text x="300" y="300" text-anchor="middle" font-size="10" fill="#555">Direkt nach dem Vertikutieren sieht der Rasen schlimmer aus — erholt sich aber deutlich besser</text>
</svg>
