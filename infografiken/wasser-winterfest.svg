<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Wasseranschlüsse winterfest machen — vor dem ersten Frost</text>

  <!-- Warum wichtig: Physik des Eises -->
  <rect x="20" y="38" width="560" height="42" rx="8" fill="#4a90d9" opacity="0.09"/>
  <text x="300" y="55" text-anchor="middle" font-size="11" font-weight="700" fill="#4a90d9">Warum Wasser so gefährlich für Leitungen ist:</text>
  <text x="300" y="71" text-anchor="middle" font-size="9" fill="#555">Wasser dehnt sich beim Gefrieren um 9 % aus → Rohre und Armaturen platzen → teure Wasserschäden</text>

  <!-- 5 Schritte als Checkliste -->
  <text x="155" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Checkliste Außenwasser</text>

  <g transform="translate(20, 108)">
    <rect x="0"  y="0"  width="265" height="34" rx="6" fill="#4a90d9" opacity="0.1"/>
    <text x="12" y="17" font-size="20">1️⃣</text>
    <text x="38" y="15" font-size="10" font-weight="700" fill="#1C4A2E">Außenhahn zudrehen</text>
    <text x="38" y="28" font-size="9" fill="#555">Hauptabsperrventil im Keller schließen</text>

    <rect x="0"  y="40" width="265" height="34" rx="6" fill="#4a90d9" opacity="0.08"/>
    <text x="12" y="57" font-size="20">2️⃣</text>
    <text x="38" y="55" font-size="10" font-weight="700" fill="#1C4A2E">Außenhahn öffnen — entleeren</text>
    <text x="38" y="68" font-size="9" fill="#555">Restwasser läuft ab, kein Eis kann sich bilden</text>

    <rect x="0"  y="80" width="265" height="34" rx="6" fill="#4a90d9" opacity="0.07"/>
    <text x="12" y="97" font-size="20">3️⃣</text>
    <text x="38" y="95" font-size="10" font-weight="700" fill="#1C4A2E">Schläuche abkoppeln</text>
    <text x="38" y="108" font-size="9" fill="#555">Angeschlossene Schläuche verhindern Entleerung!</text>

    <rect x="0"  y="120" width="265" height="34" rx="6" fill="#4a90d9" opacity="0.07"/>
    <text x="12" y="137" font-size="20">4️⃣</text>
    <text x="38" y="135" font-size="10" font-weight="700" fill="#1C4A2E">Bewässerungssystem entleeren</text>
    <text x="38" y="148" font-size="9" fill="#555">Tropfsystem, Sprinkler → Druckluft oder manuell</text>

    <rect x="0"  y="160" width="265" height="34" rx="6" fill="#1C4A2E" opacity="0.07"/>
    <text x="12" y="177" font-size="20">5️⃣</text>
    <text x="38" y="175" font-size="10" font-weight="700" fill="#1C4A2E">Ventile isolieren</text>
    <text x="38" y="188" font-size="9" fill="#555">Neopren-Haube über Außenhähne — Kälteschutz</text>
  </g>

  <!-- TRENNLINIE -->
  <line x1="300" y1="95" x2="300" y2="300" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Rechts: Leitungsweg Illustration -->
  <text x="450" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">So funktioniert der Wasserweg</text>

  <!-- Haus-Querschnitt schematisch -->
  <!-- Keller -->
  <rect x="318" y="215" width="258" height="70" rx="6" fill="#8B6914" opacity="0.2"/>
  <text x="330" y="230" font-size="9" fill="#555">Keller</text>
  <!-- Hauptrohr -->
  <rect x="390" y="120" width="12" height="95" fill="#4a90d9" opacity="0.6"/>
  <!-- Absperrventil Keller -->
  <rect x="383" y="198" width="26" height="18" rx="4" fill="#1C4A2E" opacity="0.7"/>
  <text x="396" y="210" text-anchor="middle" font-size="7" fill="#fff">STOP</text>
  <text x="330" y="210" font-size="8" fill="#1C4A2E" font-weight="600">① Hier abdrehen</text>

  <!-- Außenwand -->
  <rect x="382" y="113" width="28" height="10" fill="#8B6914" opacity="0.5"/>

  <!-- Außenhahn -->
  <rect x="375" y="100" width="42" height="16" rx="4" fill="#7a90a0" opacity="0.7"/>
  <rect x="397" y="95" width="8" height="10" rx="2" fill="#5a7080" opacity="0.8"/>
  <text x="440" y="112" font-size="8" fill="#555">② Außenhahn</text>
  <text x="440" y="123" font-size="8" fill="#555">öffnen (entleert)</text>

  <!-- Schlauchanschluss -->
  <rect x="352" y="116" width="25" height="8" rx="3" fill="#6B4423" opacity="0.6"/>
  <text x="310" y="126" font-size="8" fill="#7A2430">③ Schlauch</text>
  <text x="310" y="137" font-size="8" fill="#7A2430">ABKOPPELN!</text>
  <line x1="348" y1="120" x2="342" y2="128" stroke="#7A2430" stroke-width="1"/>

  <!-- Froststempel -->
  <text x="490" y="158" font-size="28">❄️</text>
  <text x="490" y="180" text-anchor="middle" font-size="9" fill="#4a90d9">Frost</text>
  <text x="490" y="192" text-anchor="middle" font-size="9" fill="#555">kann kommen —</text>
  <text x="490" y="204" text-anchor="middle" font-size="9" fill="#555">kein Schaden</text>

  <!-- Timing-Hinweis -->
  <rect x="20" y="298" width="560" height="18" rx="6" fill="#7A2430" opacity="0.08"/>
  <text x="300" y="311" text-anchor="middle" font-size="10" fill="#7A2430" font-weight="600">Erster Frost Berlin: statistisch Mitte Oktober — lieber einmal zu früh als einmal zu spät!</text>
</svg>
