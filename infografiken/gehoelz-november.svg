<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Gehölzschnitt im November — 4 Vorteile der Winterruhe</text>

  <!-- 4 Vorteile als Kacheln oben -->
  <g transform="translate(20, 40)">
    <!-- Vorteil 1: Struktur sichtbar -->
    <rect x="0" y="0" width="128" height="110" rx="8" fill="#1C4A2E" opacity="0.07"/>
    <text x="64" y="22" text-anchor="middle" font-size="26">🌳</text>
    <text x="64" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Struktur sichtbar</text>
    <text x="64" y="58" text-anchor="middle" font-size="9" fill="#555">Ohne Blätter sieht</text>
    <text x="64" y="71" text-anchor="middle" font-size="9" fill="#555">man Fehlastkungen,</text>
    <text x="64" y="84" text-anchor="middle" font-size="9" fill="#555">Totholz und</text>
    <text x="64" y="97" text-anchor="middle" font-size="9" fill="#555">Kreuzäste klar</text>

    <!-- Vorteil 2: Saftruhe -->
    <rect x="138" y="0" width="128" height="110" rx="8" fill="#4a90d9" opacity="0.08"/>
    <text x="202" y="22" text-anchor="middle" font-size="26">💧</text>
    <text x="202" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#4a90d9">Saftruhe</text>
    <text x="202" y="58" text-anchor="middle" font-size="9" fill="#555">Kein Saftfluss in</text>
    <text x="202" y="71" text-anchor="middle" font-size="9" fill="#555">Wunden — Baum</text>
    <text x="202" y="84" text-anchor="middle" font-size="9" fill="#555">»blutet« nicht</text>
    <text x="202" y="97" text-anchor="middle" font-size="9" fill="#555">wie im Frühjahr</text>

    <!-- Vorteil 3: Pilze schlafen -->
    <rect x="276" y="0" width="128" height="110" rx="8" fill="#3a9a4a" opacity="0.08"/>
    <text x="340" y="22" text-anchor="middle" font-size="26">🍄</text>
    <text x="340" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Wenig Pilzdruck</text>
    <text x="340" y="58" text-anchor="middle" font-size="9" fill="#555">Pilzsporen inaktiv</text>
    <text x="340" y="71" text-anchor="middle" font-size="9" fill="#555">bei Kälte — Wunden</text>
    <text x="340" y="84" text-anchor="middle" font-size="9" fill="#555">infizieren sich</text>
    <text x="340" y="97" text-anchor="middle" font-size="9" fill="#555">kaum</text>

    <!-- Vorteil 4: Planung -->
    <rect x="414" y="0" width="146" height="110" rx="8" fill="#B8892A" opacity="0.08"/>
    <text x="487" y="22" text-anchor="middle" font-size="26">📋</text>
    <text x="487" y="42" text-anchor="middle" font-size="10" font-weight="700" fill="#8B6914">Mehr Zeit</text>
    <text x="487" y="58" text-anchor="middle" font-size="9" fill="#555">Kein Gras mähen,</text>
    <text x="487" y="71" text-anchor="middle" font-size="9" fill="#555">kein Laub rechen —</text>
    <text x="487" y="84" text-anchor="middle" font-size="9" fill="#555">ideal für sorgfältige</text>
    <text x="487" y="97" text-anchor="middle" font-size="9" fill="#555">Gehölzarbeit</text>
  </g>

  <!-- Was schneiden — was NICHT -->
  <text x="300" y="172" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Was im November geschnitten werden darf:</text>

  <g transform="translate(20, 182)">
    <!-- Spalte Ja -->
    <text x="145" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">✓ Jetzt schneiden</text>
    <rect x="0"  y="20" width="288" height="20" rx="4" fill="#3a9a4a" opacity="0.12"/>
    <text x="144" y="34" text-anchor="middle" font-size="9" fill="#1C4A2E">🌳 Laubbäume: Ahorn, Linde, Eiche — Formschnitt</text>
    <rect x="0"  y="44" width="288" height="20" rx="4" fill="#3a9a4a" opacity="0.10"/>
    <text x="144" y="58" text-anchor="middle" font-size="9" fill="#1C4A2E">🌿 Sträucher: Hartriegel, Holunder, Weigelia</text>
    <rect x="0"  y="68" width="288" height="20" rx="4" fill="#3a9a4a" opacity="0.09"/>
    <text x="144" y="82" text-anchor="middle" font-size="9" fill="#1C4A2E">🌲 Totholz entfernen aus Altbäumen</text>
    <rect x="0"  y="92" width="288" height="20" rx="4" fill="#3a9a4a" opacity="0.08"/>
    <text x="144" y="106" text-anchor="middle" font-size="9" fill="#1C4A2E">✂️ Kreuzende und reibende Äste</text>
  </g>

  <line x1="320" y1="172" x2="320" y2="298" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <g transform="translate(332, 182)">
    <!-- Spalte Nein -->
    <text x="134" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="#7A2430">✗ Erst im Sommer/Frühjahr</text>
    <rect x="0"  y="20" width="250" height="20" rx="4" fill="#7A2430" opacity="0.08"/>
    <text x="125" y="34" text-anchor="middle" font-size="9" fill="#7A2430">🍒 Steinobst: Kirsche, Pflaume → Sommer!</text>
    <rect x="0"  y="44" width="250" height="20" rx="4" fill="#7A2430" opacity="0.07"/>
    <text x="125" y="58" text-anchor="middle" font-size="9" fill="#7A2430">🌸 Frühjahrsblüher: Forsythie, Flieder</text>
    <rect x="0"  y="68" width="250" height="20" rx="4" fill="#7A2430" opacity="0.06"/>
    <text x="125" y="82" text-anchor="middle" font-size="9" fill="#7A2430">🌹 Rosen → März bei Knospen-Schwellung</text>
    <rect x="0"  y="92" width="250" height="20" rx="4" fill="#7A2430" opacity="0.06"/>
    <text x="125" y="106" text-anchor="middle" font-size="9" fill="#7A2430">🪺 Gehölze mit Vogelnestern → erst prüfen</text>
  </g>

  <rect x="20" y="297" width="560" height="20" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="311" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Alte Parkbäume: Nur nach Sichtprüfung — starke Eingriffe durch zertifizierten Baumpfleger beauftragen</text>
</svg>
