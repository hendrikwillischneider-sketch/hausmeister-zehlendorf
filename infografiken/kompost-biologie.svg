<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>
  <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1C4A2E">Warum dampft der Kompost? — Millionen Helfer bei der Arbeit</text>

  <!-- Links: Komposthaufen mit Temperatur -->
  <!-- Kompost Querschnitt -->
  <rect x="25" y="55" width="240" height="160" rx="8" fill="#5a3a10" opacity="0.35"/>
  <!-- Schichten -->
  <rect x="28" y="58" width="234" height="50" rx="6" fill="#8B6914" opacity="0.4"/>
  <text x="145" y="78" text-anchor="middle" font-size="9" fill="#d4b080">Frisches Material</text>
  <text x="145" y="91" text-anchor="middle" font-size="8" fill="#c0a060">Herbstlaub, Küchenabfälle</text>

  <rect x="28" y="108" width="234" height="50" rx="0" fill="#4a2a08" opacity="0.55"/>
  <text x="145" y="130" text-anchor="middle" font-size="9" fill="#d4b080">Aktive Zone</text>
  <text x="145" y="143" text-anchor="middle" font-size="8" fill="#c0a060">hier arbeiten die Bakterien — 40–70°C!</text>

  <rect x="28" y="158" width="234" height="55" rx="6" fill="#2a1a04" opacity="0.6"/>
  <text x="145" y="178" text-anchor="middle" font-size="9" fill="#d4b080">Reifer Kompost</text>
  <text x="145" y="191" text-anchor="middle" font-size="8" fill="#c0a060">dunkel, krümelig, fertig</text>

  <!-- Dampf oben -->
  <text x="85"  y="48" font-size="16" opacity="0.7">〰</text>
  <text x="110" y="42" font-size="16" opacity="0.6">〰</text>
  <text x="135" y="48" font-size="16" opacity="0.7">〰</text>
  <text x="160" y="42" font-size="16" opacity="0.6">〰</text>
  <text x="185" y="48" font-size="16" opacity="0.7">〰</text>
  <text x="145" y="32" text-anchor="middle" font-size="9" fill="#B8892A" font-weight="600">Dampf = Bakterien-Wärme</text>

  <!-- Thermometer -->
  <rect x="248" y="100" width="12" height="80" rx="6" fill="#ddd" stroke="#aaa" stroke-width="1"/>
  <rect x="250" y="138" width="8" height="42" rx="4" fill="#c0522a"/>
  <circle cx="254" cy="183" r="8" fill="#c0522a"/>
  <text x="265" y="130" font-size="8" fill="#555">70°C</text>
  <text x="265" y="155" font-size="8" fill="#c0522a">50°C</text>
  <text x="265" y="185" font-size="8" fill="#555">Innen</text>

  <!-- Rechts: Wer arbeitet da? -->
  <text x="440" y="46" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Wer macht die Arbeit?</text>

  <g transform="translate(300, 58)">
    <rect x="0" y="0" width="280" height="46" rx="7" fill="#3a9a4a" opacity="0.1"/>
    <text x="26" y="22" font-size="26">🦠</text>
    <text x="52" y="18" font-size="10" font-weight="700" fill="#1C4A2E">Bakterien (unsichtbar)</text>
    <text x="52" y="31" font-size="9" fill="#555">Millionen pro cm³ · zersetzen organisches Material</text>
    <text x="52" y="44" font-size="9" fill="#555">erzeugen dabei Wärme — bis 70°C im Kern</text>

    <rect x="0" y="52" width="280" height="46" rx="7" fill="#B8892A" opacity="0.09"/>
    <text x="26" y="74" font-size="26">🪱</text>
    <text x="52" y="70" font-size="10" font-weight="700" fill="#8B6914">Regenwürmer</text>
    <text x="52" y="83" font-size="9" fill="#555">Lockern den Kompost · verbessern Struktur</text>
    <text x="52" y="96" font-size="9" fill="#555">Leben in den kühleren Außenbereichen</text>

    <rect x="0" y="104" width="280" height="46" rx="7" fill="#4a90d9" opacity="0.08"/>
    <text x="26" y="126" font-size="26">🍄</text>
    <text x="52" y="122" font-size="10" font-weight="700" fill="#4a90d9">Pilzmyzel (weiße Fäden)</text>
    <text x="52" y="135" font-size="9" fill="#555">Zersetzen holzige Strukturen · Ästchen und Stroh</text>
    <text x="52" y="148" font-size="9" fill="#555">Normal — kein Schimmel, sondern Helfer!</text>

    <rect x="0" y="156" width="280" height="46" rx="7" fill="#6B4423" opacity="0.09"/>
    <text x="26" y="178" font-size="26">🐛</text>
    <text x="52" y="174" font-size="10" font-weight="700" fill="#6B4423">Asseln und Käferlarven</text>
    <text x="52" y="187" font-size="9" fill="#555">Zerkleinerung größerer Partikel</text>
    <text x="52" y="200" font-size="9" fill="#555">Bereiten Material für Bakterien vor</text>
  </g>

  <rect x="20" y="272" width="560" height="22" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="287" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Für Bewohnerinnen: Der dampfende Kompost im Winter ist ein gutes Zeichen — er lebt und arbeitet</text>
</svg>
