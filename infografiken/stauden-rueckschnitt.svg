<svg viewBox="0 0 600 310" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="310" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Verblühte Stauden: Jetzt schneiden — oder stehen lassen?</text>

  <!-- Jetzt schneiden -->
  <g transform="translate(110,50)">
    <rect x="-88" y="0" width="176" height="215" rx="9" fill="#1C4A2E" opacity="0.07"/>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">✂️ Jetzt schneiden</text>
    <text x="0" y="32" text-anchor="middle" font-size="10" fill="#555">Wenn Staude krank, fault</text>
    <!-- Schnitt-Illustration -->
    <line x1="0" y1="75" x2="0" y2="52" stroke="#3a9a4a" stroke-width="3" stroke-linecap="round"/>
    <line x1="-15" y1="85" x2="-25" y2="60" stroke="#3a9a4a" stroke-width="2.5"/>
    <line x1="15" y1="85" x2="25" y2="62" stroke="#3a9a4a" stroke-width="2.5"/>
    <ellipse cx="0" cy="90" rx="30" ry="18" fill="#8B6914" opacity="0.4"/>
    <text x="50" y="68" font-size="22">✂️</text>
    <line x1="0" y1="108" x2="0" y2="140" stroke="#6B4423" stroke-width="4" stroke-linecap="round"/>
    <!-- Schnittmerk: 10 cm über Boden -->
    <line x1="-20" y1="140" x2="20" y2="140" stroke="#1C4A2E" stroke-width="1.5"/>
    <text x="30" y="143" font-size="9" fill="#1C4A2E">10 cm</text>
    <text x="0" y="162" text-anchor="middle" font-size="9" fill="#555">Schnitt dicht über Boden</text>
    <text x="0" y="175" text-anchor="middle" font-size="9" fill="#555">Abtransport verhindert</text>
    <text x="0" y="188" text-anchor="middle" font-size="9" fill="#555">Pilzsporen-Überwinterung</text>
    <text x="0" y="205" text-anchor="middle" font-size="9" fill="#7A2430" font-weight="600">z.B. Phlox, Rittersporn</text>
  </g>

  <!-- Stehen lassen -->
  <g transform="translate(300,50)">
    <rect x="-88" y="0" width="176" height="215" rx="9" fill="#B8892A" opacity="0.08"/>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#8B6914">🌾 Stehen lassen</text>
    <text x="0" y="32" text-anchor="middle" font-size="10" fill="#555">Bis Frühjahr — Mehrwert</text>
    <!-- Staude mit Samenkopf -->
    <line x1="0" y1="148" x2="0" y2="55" stroke="#6B4423" stroke-width="3"/>
    <line x1="-20" y1="148" x2="-22" y2="75" stroke="#6B4423" stroke-width="2.5"/>
    <line x1="20" y1="148" x2="22" y2="78" stroke="#6B4423" stroke-width="2.5"/>
    <!-- Samenstände -->
    <ellipse cx="0"  cy="52" rx="10" ry="14" fill="#B8892A" opacity="0.7"/>
    <ellipse cx="-22" cy="73" rx="8"  ry="11" fill="#B8892A" opacity="0.6"/>
    <ellipse cx="22"  cy="76" rx="8"  ry="11" fill="#B8892A" opacity="0.6"/>
    <!-- Vogel auf Samenstand -->
    <text x="22" y="62" font-size="14">🐦</text>
    <ellipse cx="0" cy="152" rx="38" ry="10" fill="#8B6914" opacity="0.3"/>
    <text x="0" y="170" text-anchor="middle" font-size="9" fill="#555">Vögel fressen Samen</text>
    <text x="0" y="183" text-anchor="middle" font-size="9" fill="#555">Winterschmuck im Frost</text>
    <text x="0" y="196" text-anchor="middle" font-size="9" fill="#555">Hohle Stängel = Insekten-</text>
    <text x="0" y="209" text-anchor="middle" font-size="9" fill="#555">quartier für Winter</text>
  </g>

  <!-- Faustregel rechts -->
  <g transform="translate(490,50)">
    <rect x="-80" y="0" width="160" height="215" rx="9" fill="#7A2430" opacity="0.07"/>
    <text x="0" y="18" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Faustregel</text>
    <text x="0" y="50" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Schneiden wenn:</text>
    <text x="0" y="66" text-anchor="middle" font-size="9" fill="#7A2430">🔴 Mehltau, Schorf</text>
    <text x="0" y="80" text-anchor="middle" font-size="9" fill="#7A2430">🔴 Schneckenbefall</text>
    <text x="0" y="94" text-anchor="middle" font-size="9" fill="#7A2430">🔴 Fauliger Geruch</text>
    <text x="0" y="108" text-anchor="middle" font-size="9" fill="#7A2430">🔴 Zweittrieb gewünscht</text>
    <line x1="-55" y1="118" x2="55" y2="118" stroke="#ddd" stroke-width="1"/>
    <text x="0" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Stehen lassen wenn:</text>
    <text x="0" y="151" text-anchor="middle" font-size="9" fill="#1C4A2E">🟢 Schöner Samenstand</text>
    <text x="0" y="165" text-anchor="middle" font-size="9" fill="#1C4A2E">🟢 Gesunde Pflanze</text>
    <text x="0" y="179" text-anchor="middle" font-size="9" fill="#1C4A2E">🟢 Nahe an Hecke/Gehölz</text>
    <text x="0" y="193" text-anchor="middle" font-size="9" fill="#1C4A2E">🟢 Naturgarten-Konzept</text>
  </g>

  <line x1="223" y1="45" x2="223" y2="272" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="413" y1="45" x2="413" y2="272" stroke="#ddd" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="30" y="274" width="540" height="26" rx="8" fill="#1C4A2E" opacity="0.08"/>
  <text x="300" y="291" text-anchor="middle" font-size="11" fill="#1C4A2E" font-weight="600">Kompromiss: ⅓ schneiden, ⅔ stehen lassen — gesunder Garten braucht beides</text>
</svg>
