<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Vogelfütterung im Winter — wann anfangen, was anbieten</text>

  <!-- WANN anfangen? -->
  <rect x="20" y="38" width="560" height="36" rx="8" fill="#B8892A" opacity="0.1"/>
  <text x="300" y="53" text-anchor="middle" font-size="11" font-weight="700" fill="#8B6914">Wann beginnen? Wenn Frost + Schnee die Nahrung verdecken</text>
  <text x="300" y="67" text-anchor="middle" font-size="9" fill="#555">Meist ab November · Wichtigste Zeit: Dezember bis März · Einmal anfangen = durchfüttern bis Frühjahr!</text>

  <!-- Links: Was anbieten für welchen Vogel -->
  <text x="175" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Was fressen welche Vögel?</text>

  <g transform="translate(20, 104)">
    <rect x="0" y="0" width="310" height="26" rx="5" fill="#1C4A2E" opacity="0.1"/>
    <text x="25" y="17" font-size="18">🐦</text>
    <text x="48" y="14" font-size="10" font-weight="700" fill="#1C4A2E">Meise, Kleiber, Specht</text>
    <text x="48" y="26" font-size="9" fill="#555">Sonnenblumenkerne, Erdnüsse, Meisenknödel (ohne Netz!)</text>

    <rect x="0" y="32" width="310" height="26" rx="5" fill="#B8892A" opacity="0.09"/>
    <text x="25" y="49" font-size="18">🐦</text>
    <text x="48" y="46" font-size="10" font-weight="700" fill="#8B6914">Rotkehlchen, Amseln</text>
    <text x="48" y="58" font-size="9" fill="#555">Rosinen, weiches Obst, Haferflocken — lieber auf Boden</text>

    <rect x="0" y="64" width="310" height="26" rx="5" fill="#4a90d9" opacity="0.08"/>
    <text x="25" y="81" font-size="18">🐦</text>
    <text x="48" y="78" font-size="10" font-weight="700" fill="#4a90d9">Fink, Sperling</text>
    <text x="48" y="90" font-size="9" fill="#555">Hirse, Wildkrautsamen, Getreideschrot</text>

    <rect x="0" y="96" width="310" height="26" rx="5" fill="#3a9a4a" opacity="0.09"/>
    <text x="25" y="113" font-size="18">🦉</text>
    <text x="48" y="110" font-size="10" font-weight="700" fill="#1C4A2E">Greifvögel (nicht füttern!)</text>
    <text x="48" y="122" font-size="9" fill="#555">Leben von gefütterten Kleintieren — natürliche Regulation</text>

    <rect x="0" y="128" width="310" height="26" rx="5" fill="#7A2430" opacity="0.07"/>
    <text x="25" y="145" font-size="18">🚫</text>
    <text x="48" y="142" font-size="10" font-weight="700" fill="#7A2430">Niemals: Salz, Brot, Milch</text>
    <text x="48" y="154" font-size="9" fill="#555">Brot quillt im Magen auf → tödlich für Singvögel</text>
  </g>

  <!-- TRENNLINIE -->
  <line x1="346" y1="88" x2="346" y2="298" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Rechts: Futterhaus Tipps -->
  <text x="474" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Das ideale Futterhaus im Park</text>

  <!-- Futterhaus Illustration -->
  <polygon points="420,130 530,130 475,105" fill="#6B4423"/>
  <rect x="422" y="130" width="106" height="55" fill="#8B6914" opacity="0.8"/>
  <!-- Körner drin -->
  <ellipse cx="455" cy="158" rx="12" ry="5" fill="#B8892A" opacity="0.8"/>
  <ellipse cx="495" cy="162" rx="10" ry="4" fill="#B8892A" opacity="0.7"/>
  <!-- Stab -->
  <rect x="471" y="185" width="8" height="50" fill="#6B4423"/>
  <!-- Katzensperre -->
  <text x="415" y="228" font-size="8" fill="#7A2430">Katzensperre:</text>
  <text x="415" y="240" font-size="8" fill="#555">Metallkegel unten</text>
  <line x1="460" y1="220" x2="471" y2="215" stroke="#7A2430" stroke-width="1"/>

  <!-- Höhe -->
  <line x1="556" y1="185" x2="556" y2="235" stroke="#1C4A2E" stroke-width="1.5"/>
  <line x1="551" y1="185" x2="561" y2="185" stroke="#1C4A2E" stroke-width="1.5"/>
  <line x1="551" y1="235" x2="561" y2="235" stroke="#1C4A2E" stroke-width="1.5"/>
  <text x="558" y="215" font-size="8" fill="#1C4A2E">1,5 m</text>

  <!-- Regeln -->
  <g transform="translate(352, 250)">
    <rect x="0" y="0" width="235" height="20" rx="4" fill="#3a9a4a" opacity="0.12"/>
    <text x="117" y="14" text-anchor="middle" font-size="9" fill="#1C4A2E">✓ Täglich frisch — altes Futter entfernen</text>
    <rect x="0" y="24" width="235" height="20" rx="4" fill="#3a9a4a" opacity="0.10"/>
    <text x="117" y="38" text-anchor="middle" font-size="9" fill="#1C4A2E">✓ Wöchentlich Haus desinfizieren</text>
    <rect x="0" y="48" width="235" height="20" rx="4" fill="#B8892A" opacity="0.1"/>
    <text x="117" y="62" text-anchor="middle" font-size="9" fill="#8B6914">✓ Standort: ruhig, katzengeschützt</text>
  </g>

  <rect x="20" y="298" width="560" height="18" rx="6" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="311" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Für Bewohnerinnen: Ein Futterhaus am Fenster bringt täglich Vogelbesuche — Natur erleben ohne Kälte</text>
</svg>
