<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Kompost im November — Jahresabschluss und Wintervorbereitung</text>

  <!-- Links: Was passiert im Kompost im Winter? -->
  <text x="145" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Was macht der Kompost im Winter?</text>

  <!-- Kompost-Querschnitt -->
  <!-- Rahmen/Behälter -->
  <rect x="30" y="68" width="230" height="155" rx="6" fill="none" stroke="#8B6914" stroke-width="2"/>
  <!-- Schichten von unten -->
  <!-- Reifstufe unten -->
  <rect x="32" y="180" width="226" height="41" rx="4" fill="#3a2010" opacity="0.6"/>
  <text x="145" y="197" text-anchor="middle" font-size="9" fill="#d4b080">Reifer Kompost</text>
  <text x="145" y="211" text-anchor="middle" font-size="8" fill="#b09060">dunkel, krümelig — FERTIG</text>

  <!-- Mittlere Schicht: aktiver Abbau -->
  <rect x="32" y="140" width="226" height="40" rx="0" fill="#6B4423" opacity="0.5"/>
  <text x="145" y="157" text-anchor="middle" font-size="9" fill="#d4b080">Aktiver Abbau</text>
  <text x="145" y="170" text-anchor="middle" font-size="8" fill="#c0a060">Bakterien aktiv bis ~5°C</text>

  <!-- Frisches Material oben -->
  <rect x="32" y="70" width="226" height="70" rx="4" fill="#5a7a3a" opacity="0.4"/>
  <text x="145" y="88" text-anchor="middle" font-size="22">🍂🌿</text>
  <text x="145" y="108" text-anchor="middle" font-size="9" fill="#fff">Frisches Herbst-Material</text>
  <text x="145" y="121" text-anchor="middle" font-size="8" fill="#d0e8d0">Laub, Rasenschnitt, Äste</text>

  <!-- Temperaturgradient -->
  <text x="268" y="95" font-size="8" fill="#c0522a">0°C</text>
  <text x="268" y="160" font-size="8" fill="#B8892A">30°C</text>
  <text x="268" y="210" font-size="8" fill="#c0522a">kalt</text>
  <text x="245" y="120" font-size="22">🌡️</text>

  <!-- Maßnahmen -->
  <text x="145" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">November-Aufgaben:</text>
  <text x="145" y="256" text-anchor="middle" font-size="9" fill="#555">✓ Reifen Kompost unten entnehmen</text>
  <text x="145" y="270" text-anchor="middle" font-size="9" fill="#555">✓ Herbstlaub + Grünschnitt einarbeiten</text>
  <text x="145" y="284" text-anchor="middle" font-size="9" fill="#555">✓ Abdecken mit Jutesack oder Vlies</text>
  <text x="145" y="298" text-anchor="middle" font-size="9" fill="#555">✓ Feucht, aber nicht nass halten</text>

  <!-- TRENNLINIE -->
  <line x1="300" y1="44" x2="300" y2="310" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Rechts: Was darf rein / nicht rein im Herbst? -->
  <text x="450" y="52" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Was jetzt in den Kompost?</text>

  <g transform="translate(315, 65)">
    <!-- Darf rein -->
    <text x="130" y="12" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">✓ Darf rein</text>
    <rect x="0" y="18" width="260" height="22" rx="5" fill="#3a9a4a" opacity="0.12"/>
    <text x="130" y="33" text-anchor="middle" font-size="9" fill="#1C4A2E">🍂 Herbstlaub (in kleinen Mengen)</text>

    <rect x="0" y="44" width="260" height="22" rx="5" fill="#3a9a4a" opacity="0.10"/>
    <text x="130" y="59" text-anchor="middle" font-size="9" fill="#1C4A2E">🌿 Küchenabfälle, Kaffeesatz</text>

    <rect x="0" y="68" width="260" height="22" rx="5" fill="#3a9a4a" opacity="0.09"/>
    <text x="130" y="83" text-anchor="middle" font-size="9" fill="#1C4A2E">🌱 Grünschnitt, Rasenschnitt</text>

    <rect x="0" y="92" width="260" height="22" rx="5" fill="#3a9a4a" opacity="0.08"/>
    <text x="130" y="107" text-anchor="middle" font-size="9" fill="#1C4A2E">🪵 Häckselgut, Zweige (klein)</text>

    <!-- Darf NICHT rein -->
    <text x="130" y="135" text-anchor="middle" font-size="10" font-weight="700" fill="#7A2430">✗ Nicht in den Kompost</text>

    <rect x="0" y="140" width="260" height="22" rx="5" fill="#7A2430" opacity="0.08"/>
    <text x="130" y="155" text-anchor="middle" font-size="9" fill="#7A2430">🤒 Krankes Pflanzenmaterial</text>

    <rect x="0" y="166" width="260" height="22" rx="5" fill="#7A2430" opacity="0.07"/>
    <text x="130" y="181" text-anchor="middle" font-size="9" fill="#7A2430">🍖 Fleisch, Fisch, gekochtes Essen</text>

    <rect x="0" y="192" width="260" height="22" rx="5" fill="#7A2430" opacity="0.06"/>
    <text x="130" y="207" text-anchor="middle" font-size="9" fill="#7A2430">🌰 Buchsbaumzünsler-Triebe</text>

    <rect x="0" y="218" width="260" height="22" rx="5" fill="#7A2430" opacity="0.06"/>
    <text x="130" y="233" text-anchor="middle" font-size="9" fill="#7A2430">🍂 Eichen-/Walnusslaub (zu sauer)</text>
  </g>

  <rect x="20" y="295" width="560" height="22" rx="7" fill="#B8892A" opacity="0.1"/>
  <text x="300" y="310" text-anchor="middle" font-size="10" fill="#8B6914" font-weight="600">Fertiger Kompost aus dem November = beste Erde fürs Frühjahr — für Beete und Neupflanzungen</text>
</svg>
