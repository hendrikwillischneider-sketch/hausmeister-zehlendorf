<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="300" fill="#F6F1E9" rx="12"/>
  <text x="300" y="24" text-anchor="middle" font-size="14" font-weight="700" fill="#1C4A2E">Warum August der richtige Schnitt-Zeitpunkt ist</text>

  <!-- 3 Gründe als breite Kacheln -->

  <!-- Grund 1: Brut ist vorbei -->
  <rect x="20" y="38" width="560" height="68" rx="8" fill="#3a9a4a" opacity="0.09"/>
  <text x="60" y="62" font-size="28">🐦</text>
  <text x="95" y="57" font-size="11" font-weight="700" fill="#1C4A2E">① Die Brutsaison ist beendet</text>
  <text x="95" y="73" font-size="9" fill="#555">Vögel brüten in Deutschland bis Ende Juli — danach ist der Schnitt gesetzlich unproblematisch</text>
  <text x="95" y="87" font-size="9" fill="#555">§ 39 BNatSchG: Starker Rückschnitt verboten 1. März – 30. September (außer schonende Pflege)</text>
  <text x="540" y="78" text-anchor="middle" font-size="9" fill="#3a9a4a" font-weight="600">✓ Erlaubt</text>

  <!-- Grund 2: Noch genug Wachstumszeit -->
  <rect x="20" y="116" width="560" height="68" rx="8" fill="#B8892A" opacity="0.09"/>
  <text x="60" y="140" font-size="28">🌱</text>
  <text x="95" y="135" font-size="11" font-weight="700" fill="#8B6914">② Die Hecke hat Zeit zum Verwachsen</text>
  <text x="95" y="151" font-size="9" fill="#555">Nach dem Schnitt wächst die Hecke 4–6 Wochen nach — Wunden schließen sich vor dem Winter</text>
  <text x="95" y="165" font-size="9" fill="#555">Schnitt im Oktober: zu wenig Ausheilzeit · Schnitt im November: neuer Trieb friert ab</text>
  <text x="540" y="156" text-anchor="middle" font-size="9" fill="#B8892A" font-weight="600">Aug = ideal</text>

  <!-- Grund 3: Saftfluss noch aktiv aber abnehmend -->
  <rect x="20" y="194" width="560" height="68" rx="8" fill="#4a90d9" opacity="0.08"/>
  <text x="60" y="218" font-size="28">💧</text>
  <text x="95" y="213" font-size="11" font-weight="700" fill="#4a90d9">③ Geringer Saftfluss = sauberer Schnitt</text>
  <text x="95" y="229" font-size="9" fill="#555">Im Frühling zirkuliert der Saft stark — Wunden heilen schlechter, Pilze können leichter eindringen</text>
  <text x="95" y="243" font-size="9" fill="#555">Im August verlangsamt sich der Saftstrom — perfekte Bedingungen für Formschnitt</text>
  <text x="540" y="234" text-anchor="middle" font-size="9" fill="#4a90d9" font-weight="600">Kein Stress</text>

  <rect x="20" y="272" width="560" height="22" rx="6" fill="#1C4A2E" opacity="0.07"/>
  <text x="300" y="287" text-anchor="middle" font-size="10" fill="#1C4A2E" font-weight="600">Für Bewohnerinnen: Die Hecke sieht jetzt frisch und ordentlich aus — und bleibt es bis zum Frühjahr</text>
</svg>
