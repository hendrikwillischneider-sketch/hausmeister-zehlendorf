<svg viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,sans-serif">
  <rect width="600" height="320" fill="#F6F1E9" rx="12"/>
  <text x="300" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#1C4A2E">Blumenzwiebeln richtig setzen — wo und wie im alten Park</text>

  <!-- LINKS: Pflanzschema unter Bäumen -->
  <text x="150" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Ideal: Unter alten Bäumen</text>
  <text x="150" y="63" text-anchor="middle" font-size="9" fill="#555">Blühen bevor das Blattwerk austreibt</text>

  <!-- Baum-Silhouette -->
  <ellipse cx="150" cy="130" rx="100" ry="60" fill="#2d7a3a" opacity="0.3"/>
  <rect x="143" y="188" width="14" height="35" fill="#6B4423"/>

  <!-- Boden -->
  <rect x="30" y="222" width="240" height="30" fill="#8B6914" opacity="0.4"/>

  <!-- Zwiebeln im Boden -->
  <ellipse cx="65"  cy="218" rx="9" ry="7" fill="#B8892A" opacity="0.9"/>
  <ellipse cx="100" cy="215" rx="9" ry="7" fill="#B8892A" opacity="0.9"/>
  <ellipse cx="138" cy="220" rx="9" ry="7" fill="#B8892A" opacity="0.9"/>
  <ellipse cx="175" cy="214" rx="9" ry="7" fill="#B8892A" opacity="0.9"/>
  <ellipse cx="210" cy="219" rx="9" ry="7" fill="#B8892A" opacity="0.9"/>
  <ellipse cx="245" cy="216" rx="9" ry="7" fill="#B8892A" opacity="0.9"/>

  <!-- Blüten oben -->
  <text x="65"  y="190" text-anchor="middle" font-size="16">🌷</text>
  <text x="100" y="185" text-anchor="middle" font-size="16">🌼</text>
  <text x="138" y="192" text-anchor="middle" font-size="16">🌷</text>
  <text x="175" y="184" text-anchor="middle" font-size="16">🌼</text>
  <text x="210" y="190" text-anchor="middle" font-size="16">🌷</text>
  <text x="245" y="186" text-anchor="middle" font-size="16">🌼</text>

  <text x="150" y="264" text-anchor="middle" font-size="9" fill="#555">Naturalistisch streuen — nicht in Reihen!</text>
  <text x="150" y="278" text-anchor="middle" font-size="9" fill="#B8892A" font-weight="600">→ Passend zu altem Parkcharakter</text>

  <!-- Tipp: Handvoll fallen lassen -->
  <rect x="30" y="284" width="240" height="30" rx="6" fill="#1C4A2E" opacity="0.08"/>
  <text x="150" y="299" text-anchor="middle" font-size="9" fill="#555">Tipp: Handvoll auf Boden werfen</text>
  <text x="150" y="311" text-anchor="middle" font-size="9" fill="#555">→ Genau dort einsetzen wo sie landen</text>

  <!-- TRENNLINIE -->
  <line x1="300" y1="42" x2="300" y2="316" stroke="#ddd" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- RECHTS: Pflanztabelle -->
  <text x="450" y="50" text-anchor="middle" font-size="11" font-weight="700" fill="#1C4A2E">Tiefe · Abstand · Zeigerspitze</text>

  <!-- Tabelle Header -->
  <rect x="308" y="58" width="278" height="20" rx="4" fill="#1C4A2E" opacity="0.15"/>
  <text x="355" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Sorte</text>
  <text x="440" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Tiefe</text>
  <text x="510" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Abstand</text>
  <text x="570" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#fff">Blüte</text>

  <!-- Zeilen -->
  <g font-size="9" fill="#555">
    <text x="315" y="93">🌷 Tulpe</text>
    <text x="427" y="93" text-anchor="middle">15–20 cm</text>
    <text x="497" y="93" text-anchor="middle">10–15 cm</text>
    <text x="560" y="93" text-anchor="middle" fill="#3a9a4a">Apr–Mai</text>

    <text x="315" y="113">🌼 Narzisse</text>
    <text x="427" y="113" text-anchor="middle">10–15 cm</text>
    <text x="497" y="113" text-anchor="middle">10–15 cm</text>
    <text x="560" y="113" text-anchor="middle" fill="#3a9a4a">März–Apr</text>

    <text x="315" y="133">💜 Krokus</text>
    <text x="427" y="133" text-anchor="middle">5–8 cm</text>
    <text x="497" y="133" text-anchor="middle">5–8 cm</text>
    <text x="560" y="133" text-anchor="middle" fill="#3a9a4a">Feb–März</text>

    <text x="315" y="153">🔵 Blaustern</text>
    <text x="427" y="153" text-anchor="middle">5–8 cm</text>
    <text x="497" y="153" text-anchor="middle">5 cm</text>
    <text x="560" y="153" text-anchor="middle" fill="#3a9a4a">März</text>

    <text x="315" y="173">⚪ Schneeglöckch.</text>
    <text x="427" y="173" text-anchor="middle">5–8 cm</text>
    <text x="497" y="173" text-anchor="middle">5–8 cm</text>
    <text x="560" y="173" text-anchor="middle" fill="#3a9a4a">Jan–März</text>
  </g>

  <!-- Linien zwischen Zeilen -->
  <line x1="308" y1="99"  x2="586" y2="99"  stroke="#ddd" stroke-width="0.8"/>
  <line x1="308" y1="119" x2="586" y2="119" stroke="#ddd" stroke-width="0.8"/>
  <line x1="308" y1="139" x2="586" y2="139" stroke="#ddd" stroke-width="0.8"/>
  <line x1="308" y1="159" x2="586" y2="159" stroke="#ddd" stroke-width="0.8"/>

  <!-- Regel: Zwiebel-Orientierung -->
  <rect x="308" y="186" width="278" height="50" rx="7" fill="#B8892A" opacity="0.1"/>
  <text x="447" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#8B6914">Zeigerspitze immer NACH OBEN!</text>
  <!-- Zwiebel-Symbol -->
  <ellipse cx="360" cy="224" rx="14" ry="10" fill="#B8892A" opacity="0.8"/>
  <line x1="360" y1="214" x2="360" y2="202" stroke="#3a9a4a" stroke-width="2" stroke-linecap="round"/>
  <text x="380" y="220" font-size="9" fill="#555">Spitze = wo der Trieb</text>
  <text x="380" y="232" font-size="9" fill="#555">austritt → oben</text>

  <!-- Wann pflanzen? -->
  <rect x="308" y="244" width="278" height="36" rx="7" fill="#1C4A2E" opacity="0.07"/>
  <text x="447" y="260" text-anchor="middle" font-size="10" font-weight="700" fill="#1C4A2E">Pflanzzeitraum: Oktober bis November</text>
  <text x="447" y="276" text-anchor="middle" font-size="9" fill="#555">Erst bei Boden unter 10°C — verhindert Fäulnis</text>

  <!-- Bewohnerinnen -->
  <rect x="308" y="286" width="278" height="28" rx="7" fill="#3a9a4a" opacity="0.09"/>
  <text x="447" y="302" text-anchor="middle" font-size="10" font-weight="600" fill="#1C4A2E">Für Bewohnerinnen: Im März leuchten die ersten Farben</text>
</svg>
